/* ---- MUT status ---- */
function sesCount(p){return(p.sessions||[]).length;}
function mutStatus(p){const n=sesCount(p);if(p.bukanMusuh==="Tidak")return{k:"a",t:"Tidak layak (musuh Islam)"};if(n>=3&&p.minatUsrah==="Ya")return{k:"g",t:"Layak Tarsyih"};if(n>=3)return{k:"a",t:"Tunggu minat usrah"};if(n>0)return{k:"",t:""};return{k:"n",t:"Belum mula"};}
/* ---- BPMy ---- */
function bpmy(p){const sc=p.bpmy||{};let total=0;const cats=BPMY.map(c=>{let s=0,max=0;c.items.forEach(it=>{s+=(sc[it.id]||0)*it.w;max+=5*it.w;});total+=s;return{id:c.id,name:c.name,score:s,max:max};});
  return{cats,total,pct:total/BPMY_MAX,pass:(total/BPMY_MAX)>=0.5};}
function muhStatus(p){const b=bpmy(p);const pc=Math.round(b.pct*100);if(b.pass)return{k:"g",t:"Layak MAY · "+pc+"%"};if(b.total>0)return{k:"b",t:"BPMy "+pc+"%"};return{k:"n",t:"Baru muhib"};}
function statusOf(p){if(p.stage==="mutabaah")return mutStatus(p);if(p.stage==="muhib")return muhStatus(p);if(p.stage==="muayyid")return{k:"g",t:"Muayyid"};return{k:"n",t:"Baru"};}
function eligible(p){if(p.stage==="mutabaah")return sesCount(p)>=3&&p.minatUsrah==="Ya"&&p.bukanMusuh!=="Tidak";if(p.stage==="muhib")return bpmy(p).pass;return false;}
function stageCode(s){return {mutabaah:"MUT",muhib:"MUH",muayyid:"MAY"}[s]||"—";}
function stageLabel(s){return(STAGES.find(x=>x.id===s)||{}).label||s;}

    <button class="add" id="saveUsrahBtn" style="width:100%;margin-top:12px"${nSel?"":" disabled"}>Simpan usrah · ${nSel} hadir</button>
  </div>`;
  const groups=usrahGroups().sort((a,b)=>(b.tarikh||"").localeCompare(a.tarikh||""));

  if(groups.length){const byM={};groups.forEach(gr=>{const mk=(gr.tarikh||"").slice(0,7)||"zzzz";(byM[mk]=byM[mk]||[]).push(gr);});
    past=Object.keys(byM).sort((a,b)=>b.localeCompare(a)).map(mk=>{const lbl=mk==="zzzz"?"Tiada tarikh":(MM[(+mk.slice(5,7))-1]+" "+mk.slice(0,4));return `<div class="grouphdr">${lbl}<span class="gc">${byM[mk].length}</span></div>`+byM[mk].map(gr=>`<div class="urow"><div class="urow-h" data-ulog="${gr.id}"><div class="wdate pa"><div class="wdd">${(gr.tarikh||"").slice(8,10)||"—"}</div><div class="wdm">${monShort(gr.tarikh)}</div></div><div class="rname">${esc(gr.jenis)}${gr.butiran?" · "+esc(gr.butiran):""}<div class="hsub">${esc(gr.pd||"(Tiada PD)")} · ${gr.att.length} hadir</div></div><span class="chev">${uLogOpen===gr.id?"▴":"▾"}</span></div>${uLogOpen===gr.id?`<div class="urow-b"><div class="uchips">${gr.att.map(nm=>`<span class="uchip on" style="cursor:default">${esc(nm)}</span>`).join("")}</div><button class="del" data-udel="${gr.id}" style="margin-top:10px;width:100%">Padam usrah ini</button></div>`:""}</div>`).join("");}).join("");

/* helpers for fields */
function fieldId(kind,id,f){return `field-${kind}-${String(id).replace(/[^A-Za-z0-9_-]/g,"-")}-${String(f).replace(/[^A-Za-z0-9_-]/g,"-")}`;}
function T(id,f,v,ph,type){return `<input id="${fieldId("ed",id,f)}" data-ed="${id}" data-f="${f}" type="${type||"text"}" value="${esc(v)}" placeholder="${ph||""}">`;}
function TA(id,f,v,ph){return `<textarea id="${fieldId("ed",id,f)}" data-ed="${id}" data-f="${f}" placeholder="${ph||""}">${esc(v)}</textarea>`;}
function SELf(id,f,v,opts){return `<select id="${fieldId("ed",id,f)}" data-ed="${id}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function fld(l,inner){const match=inner.match(/\bid="([^"]+)"/);let control=inner;if(!match){if(/<(input|select|textarea)\b/.test(inner))control=inner.replace(/<(input|select|textarea)\b/,`<$1 aria-label="${esc(l)}"`);else if(inner.includes('class="toggle'))control=inner.replace('class="toggle"',`class="toggle" role="group" aria-label="${esc(l)}"`);}return `<div class="fld"><label${match?` for="${match[1]}"`:""}>${l}</label>${control}</div>`;}
function attList(kind,id,arr){arr=arr||[];return `<div class="grp"><h3>Lampiran (fail di Drive)</h3>${arr.length?arr.map((a,i)=>`<div class="subrow rowflex"><a href="${esc(a.url)}" target="_blank" rel="noopener" style="flex:1;color:var(--blue-2);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name||"fail")}</a><button class="delmini" data-rmatt="${kind}|${id}|${i}">✕</button></div>`).join(""):`<div class="hint">Tiada lampiran lagi.</div>`}<button class="addsub" data-uplbtn="${kind}|${id}">＋ Muat naik fail</button>${SYNC.ok?"":`<div class="hint">Log masuk & sync dahulu untuk muat naik ke Drive.</div>`}</div>`;}
function selManaged(id,f,v,list){const opts=S[list]||[];const cur=(v&&!opts.includes(v))?`<option selected>${esc(v)}</option>`:"";return `<select data-ed="${id}" data-f="${f}" data-list="${list}"><option value="">— pilih —</option>${cur}${opts.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}<option value="__add__">＋ Tambah baharu…</option></select>`;}
function selPd(id,f,v){const opts=pdOptions();const cur=(v&&!opts.includes(v))?`<option selected>${esc(v)}</option>`:"";return `<select data-ed="${id}" data-f="${f}"><option value="">— pilih PD —</option>${cur}${opts.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`;}
function stageSelect(id,v){return `<select data-ed="${id}" data-f="stage">`+STAGES.map(s=>`<option value="${s.id}"${s.id===v?" selected":""}>${s.label}</option>`).join("")+`</select>`;}

/* ---------- KEAHLIAN ---------- */
function pdOptions(){return(S.pdList||[]).map(x=>(x.nama||"").trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b));}
function iptOptions(){const set=new Set(S.universities||[]);S.people.forEach(p=>{if(p.universiti)set.add(p.universiti);});return[...set].sort();}
function iptLabel(u){u=(u||"").trim();return {"UiTM Puncak Perdana":"UiTM PP","UiTM Shah Alam":"UiTM SA"}[u]||u;}
function iptColor(u){u=(u||"").trim();if(!u)return "#b8c2d6";const fixed={"MSU":"#6b3fa0","UiTM Shah Alam":"#e07b39","UiTM Puncak Perdana":"#1f9d55"};if(fixed[u])return fixed[u];const pal=["#147FB3","#c2367a","#3f74d6","#2a9d8f","#7048b6","#d98324"];let s=0;for(let i=0;i<u.length;i++)s=(s+u.charCodeAt(i))%99991;return pal[s%pal.length];}
function filteredPeople(){let list=S.people.slice();
  if(showArsip)list=list.filter(p=>p.arsip);else list=list.filter(p=>!p.arsip);
  if(stage!=="all")list=list.filter(p=>p.stage===stage);
  if(q)list=list.filter(p=>(p.nama||"").toLowerCase().includes(q));
  if(F.pd){if(F.pd==="__none__")list=list.filter(p=>!p.pd1&&!p.pd2);else list=list.filter(p=>p.pd1===F.pd||p.pd2===F.pd);}
  if(F.minat)list=list.filter(p=>(p.minatUsrah||"Belum")===F.minat);
  if(F.ajk)list=list.filter(p=>(p.minatAJK||"Tidak")===F.ajk);
  if(F.ipt){if(F.ipt==="__blank__")list=list.filter(p=>!(p.universiti||"").trim());else list=list.filter(p=>(p.universiti||"")===F.ipt);}
  if(F.tahun)list=list.filter(p=>(p.tahunPSPB||"")===F.tahun);
  if(F.minSesi){const n=+F.minSesi;list=list.filter(p=>n===3?sesCount(p)>=3:sesCount(p)===n);}
  list.sort((a,b)=>(a.nama||"~").localeCompare(b.nama||"~"));
  return list;}

    ${(arsipN>0||showArsip)?`<div style="display:flex;justify-content:flex-end;margin:2px 0 8px"><button class="arsiplink" data-arsip="1">${showArsip?"← Senarai aktif":("Arkib ("+arsipN+")")}</button></div>`:""}

function statsPD(){const map={};const MM=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];
  S.people.forEach(p=>{(p.sessions||[]).forEach(s=>{if(s.jenis!=="Usrah"&&s.jenis!=="DF")return;const mk=(s.tarikh||"").slice(0,7);[s.oleh||p.pd1,s.oleh2].forEach(who=>{if(!who)return;map[who]=map[who]||{};map[who][mk]=map[who][mk]||{U:0,D:0};if(s.jenis==="Usrah")map[who][mk].U++;else map[who][mk].D++;});});});
  const keys=Object.keys(map).sort();if(!keys.length)return "";
  const body=keys.map(k=>{const months=Object.keys(map[k]).filter(x=>x).sort();
    const lines=months.map(m=>{const pr=m.split("-");const lbl=(MM[(+pr[1])-1]||pr[1])+" "+pr[0];return `<div class="stat-row" style="padding-left:12px"><span style="color:var(--muted)">${lbl}</span><b>${map[k][m].U} usrah · ${map[k][m].D} DF</b></div>`;}).join("");
    const tU=months.reduce((a,m)=>a+map[k][m].U,0),tD=months.reduce((a,m)=>a+map[k][m].D,0);
    return `<div style="margin-bottom:8px"><div class="stat-row" style="font-weight:800;color:var(--ink)"><span>${esc(k)}</span><b>${tU} usrah · ${tD} DF</b></div>${lines}</div>`;}).join("");
  return `<details class="stats"><summary style="cursor:pointer;font-weight:800;color:var(--blue)">Kekerapan usrah / DF ikut PD</summary><div style="margin-top:8px">${body}</div></details>`;
}

function iptPills(){let base=S.people.filter(p=>!p.arsip);if(stage!=="all")base=base.filter(p=>p.stage===stage);
  const counts={};let blank=0;base.forEach(p=>{const u=(p.universiti||"").trim();if(!u)blank++;else counts[u]=(counts[u]||0)+1;});
  const names=Object.keys(counts).sort();const dot=c=>`<span class="iptdot" style="background:${c}"></span>`;
  let out=`<button class="ipt-pill${!F.ipt?" active":""}" data-iptp=""><span class="lbl">Semua</span><span class="c">${base.length}</span></button>`;
  out+=names.map(n=>`<button class="ipt-pill${F.ipt===n?" active":""}" data-iptp="${encodeURIComponent(n)}">${dot(iptColor(n))}<span class="lbl">${esc(iptLabel(n))}</span><span class="c">${counts[n]}</span></button>`).join("");
  if(blank)out+=`<button class="ipt-pill blank${F.ipt==="__blank__"?" active":""}" data-iptp="__blank__">${dot("#b8c2d6")}<span class="lbl">(Tiada IPT)</span><span class="c">${blank}</span></button>`;
  return `<div class="iptbar">${out}</div>`;}

function progColor(k){return {g:"var(--green)",a:"var(--amber)",b:"var(--blueb)",n:"var(--muted)"}[k]||"var(--muted)";}
function ktable(list){const ar=k=>sortKey===k?(sortDir==="asc"?" ↑":" ↓"):" ⇅";return `<table class="ktbl"><thead><tr><th>Peringkat</th><th class="sortable" data-sort="nama">Nama${ar("nama")}</th><th>IPT</th><th>PD</th><th class="sortable" data-sort="sesi">Sesi${ar("sesi")}</th><th>Progres</th></tr></thead><tbody>`+list.map(p=>{const st=statusOf(p);const pd=[p.pd1,p.pd2].filter(Boolean).join(", ")||(p.stage!=="muayyid"?`<span style="color:var(--red);font-weight:700">Tiada PD</span>`:"—");return `<tr data-sel="${p.id}" role="button" tabindex="0" aria-label="Buka ${esc(p.nama||"ahli")}"><td><span class="ptag rav-${p.stage}">${stageCode(p.stage)}</span></td><td class="ktname">${esc(p.nama||"(nama)")}</td><td>${p.universiti?`<span class="iptdot" style="background:${iptColor(p.universiti)};margin-right:6px"></span>${esc(iptLabel(p.universiti))}`:"—"}</td><td>${pd}</td><td>${p.stage==="mutabaah"?sesCount(p):"—"}</td><td>${st.t?`<span style="color:${progColor(st.k)};font-weight:700">${esc(st.t)}</span>`:"—"}</td></tr>`;}).join("")+`</tbody></table>`;}
function kcards(list){return list.map(p=>{const st=statusOf(p);const pdArr=[p.pd1,p.pd2].filter(Boolean);const sub=[p.universiti?`<span class="iptdot" style="background:${iptColor(p.universiti)};margin-right:5px"></span>${esc(iptLabel(p.universiti))}`:"Tiada IPT"];if(p.stage!=="muayyid")sub.push(pdArr.length?esc(pdArr.join(", ")):`<span style="color:var(--red)">Tiada PD</span>`);return `<div class="kc" data-sel="${p.id}" role="button" tabindex="0" aria-label="Buka ${esc(p.nama||"ahli")}"><div class="kc-av rav-${p.stage}">${stageCode(p.stage)}</div><div class="kc-main"><div class="kc-name">${esc(p.nama||"(nama)")}</div><div class="kc-sub">${sub.join(" · ")}${st.t?` · <span style="color:${progColor(st.k)};font-weight:700">${esc(st.t)}</span>`:""}</div></div><span class="chev">›</span></div>`;}).join("");}
function sortList(l){const d=sortDir==="asc"?1:-1;return l.slice().sort((a,b)=>sortKey==="sesi"?(sesCount(a)-sesCount(b))*d:(a.nama||"~").localeCompare(b.nama||"~")*d);}
function renderGrouped(list){
  if(!list.length)return `<div class="empty"><b>Tiada rekod</b><br>Tekan ＋ Tambah atau muat senarai Excel.</div>`;
  const g={};list.forEach(p=>{const y=p.tahunPSPB||"(Tiada tahun)";(g[y]=g[y]||[]).push(p);});
  const years=Object.keys(g).sort((a,b)=>b.localeCompare(a));
  return years.map(y=>{const l=sortList(g[y]);return `<div class="grouphdr">Tahun PSPB ${esc(y)}<span class="gc">${l.length}</span></div><div class="kwrap-tbl">${ktable(l)}</div><div class="kwrap-card">${kcards(l)}</div>`;}).join("");
}

function rowKeahlian(p){
  const st=statusOf(p);const pdArr=[p.pd1,p.pd2].filter(Boolean);const sub=[];
  if(p.stage!=="muayyid"){ if(pdArr.length)sub.push(esc(pdArr.join(", "))); else sub.push(`<span style="color:var(--red);font-weight:700">Tiada PD</span>`); }
  if(p.stage==="mutabaah")sub.push(sesCount(p)+" sesi");
  if(st.t){const cc={g:"var(--green)",a:"var(--amber)",b:"var(--blueb)",n:"var(--muted)"}[st.k]||"var(--muted)";sub.push(`<span style="color:${cc};font-weight:700">${st.t}</span>`);}
  return `<div class="row${selId===p.id?" sel":""}">
    <div class="rhead" data-sel="${p.id}"><span class="iptblk" style="background:${iptColor(p.universiti)}" title="${esc(p.universiti||"Tiada IPT")}"></span><div class="rav rav-${p.stage}" title="${esc(stageLabel(p.stage))}">${stageCode(p.stage)}</div>
      <div class="rname${p.nama?"":" empty"}">${p.nama?esc(p.nama):"(nama baharu)"}<div class="hsub">${sub.join(" · ")}</div></div>
      <span class="chev">›</span></div>
  </div>`;
}
function detailDrawer(){const p=get(selId);if(!p)return "";

      <div class="g2">${fld("Poskod",T(p.id,"poskod",p.poskod,"40000"))}${fld("Negeri",SELf(p.id,"negeri",p.negeri,NEGERI))}</div>

function secPD(p){const isMay=p.stage==="muayyid";return `<div class="grp"><h3>${isMay?"Peringkat & Tahun":"Penggerak Dakwah"}</h3>
  ${isMay?"":`<div class="g2">${fld("PD 1",selPd(p.id,"pd1",p.pd1))}${fld("PD 2",selPd(p.id,"pd2",p.pd2))}</div>`}

function secPassing(p){return `<div class="grp"><h3>Passing ke cawangan lain</h3>
    ${fld("Passing?",`<div class="toggle"><button data-tgl="${p.id}|passing|true" class="${p.passing?"on":""}">Ya</button><button data-tgl="${p.id}|passing|false" class="${!p.passing?"on":""}">Tidak</button></div>`)}
    ${p.passing?`<div class="g2">${fld("Cawangan tujuan",T(p.id,"passCaw",p.passCaw,"cth. PEMBINA UM"))}${fld("Pautan borang passing (Drive)",T(p.id,"passLink",p.passLink,"https://…"))}</div><div class="hint">Muat naik borang passing ke Google Drive, tampal pautannya di sini untuk dokumentasi.</div>`:``}
  </div>`;}
function secCatatan(p){return `<div class="grp"><h3>Catatan</h3>${fld("Nota",TA(p.id,"catatan",p.catatan,"Nota…"))}</div>`+attList("person",p.id,p.lampiran);}
function editorKeahlian(p){
  const info=secPD(p)+secMaklumat(p);
  const pc=secPassing(p)+secCatatan(p);
  let tabs;
  if(p.stage==="muayyid"){tabs=[["Maklumat & PD",info],["Passing & Catatan",pc]];}
  else if(p.stage==="muhib"){tabs=[["Pencalonan Muayyid",muhSection(p)],["Kehadiran",mutSection(p)],["Maklumat & PD",info],["Passing & Catatan",pc]];}
  else{tabs=[["Kehadiran",mutSection(p)],["Maklumat & PD",info],["Passing & Catatan",pc]];}
  const t=Math.min(p._etab||1,tabs.length);
  const nav=`<div class="etabs">`+tabs.map((tb,i)=>`<button class="etab${(t===i+1)?" on":""}" data-etab="${p.id}|${i+1}">${tb[0]}</button>`).join("")+`</div>`;
  let lab="";if(p.stage==="mutabaah")lab="Naik ke Muhib →";else if(p.stage==="muhib")lab="Naik ke Muayyid →";
  const act=`<div class="actions">${lab?`<button class="promote${eligible(p)?" ready":""}" data-promote="${p.id}">${lab}</button>`:``}<button class="arch" data-arch="${p.id}">${p.arsip?"Nyah-arkib":"Arkib"}</button><button class="del" data-del="${p.id}">Buang</button></div>`;
  return nav+tabs[t-1][1]+act;
}

function memCalendar(p){
  const y=memCalDate.getFullYear(),mo=memCalDate.getMonth();
  const MM=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  const dows=["Isn","Sel","Rab","Kha","Jum","Sab","Ahd"];
  const byDay={};(p.sessions||[]).forEach(s=>{if(!s.tarikh)return;(byDay[s.tarikh]=byDay[s.tarikh]||[]).push(s);});
  // absences: usrah/DF held by this mad'u's PD but not attended
  const mine=new Set((p.sessions||[]).map(s=>s._usrahId).filter(Boolean));
  const absent={};usrahGroups().forEach(g=>{if(!g.tarikh)return;if(g.jenis!=="Usrah")return;const myPD=g.pd&&(g.pd===p.pd1||g.pd===p.pd2);if(myPD&&!mine.has(g.id)&&!byDay[g.tarikh]){absent[g.tarikh]=(absent[g.tarikh]||0)+1;}});
  const first=new Date(y,mo,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);const out=d.getMonth()!==mo;const ss=byDay[iso]||[];const ab=absent[iso];const cls=ss.length?(ss[0].jenis==="DF"?"df":(ss[0].jenis==="Program"?"pg":"us")):(ab?"abs":"");
    const tag=ss.length?(ss.length>1?ss.length+" sesi":esc(ss[0].jenis)):(ab?"Absen":"");
    const tt=ss.length?ss.map(x=>esc(x.jenis)+(x.oleh?" · "+esc(x.oleh):"")).join(", "):(ab?"Tidak hadir usrah PD":"");
    cells+=`<div class="cald memday ${cls}${out?" out":""}" title="${tt}"><div class="dn">${d.getDate()}</div>${tag?`<div class="memtag">${tag}</div>`:""}</div>`;}
  const nAbs=Object.keys(absent).filter(k=>k.slice(0,7)===(y+"-"+String(mo+1).padStart(2,"0"))).length;
  return `<div class="memcal"><div class="caltop"><button class="btn2" data-memcal="-1" aria-label="Bulan sebelum">‹</button><h3>${MM[mo]} ${y}</h3><button class="btn2" data-memcal="1" aria-label="Bulan seterusnya">›</button></div><div class="cal">${dows.map(x=>`<div class="calh">${x}</div>`).join("")}${cells}</div><div class="memleg"><span><i class="lg us"></i>Hadir</span><span><i class="lg abs"></i>Tidak hadir${nAbs?" ("+nAbs+")":""}</span></div></div>`;
}
function mutSection(p){
  const ses=(p.sessions||[]).map(s=>`<div class="subrow">
     <div class="g2">${fld("Jenis",SELf2(p.id,s.id,"jenis",s.jenis,SES_JENIS))}${fld("Tarikh",Ts(p.id,s.id,"tarikh",s.tarikh,"date"))}</div>
     <div class="g2">${fld("PD 1",SESpd(p.id,s.id,"oleh",s.oleh))}${fld("PD 2",SESpd(p.id,s.id,"oleh2",s.oleh2))}</div>
     <div class="rowflex"><div style="flex:1">${fld("Butiran (pilihan)",Ts(p.id,s.id,"nota",s.nota,"nota"))}</div><button class="delmini" data-delses="${p.id}|${s.id}">✕</button></div>
   </div>`).join("");
  return `<div class="grp"><h3>Kehadiran usrah / DF · ${sesCount(p)} sesi</h3>
    <div class="hint" style="margin-bottom:6px">Kalendar kehadiran</div>${memCalendar(p)}
    ${ses||`<div class="hint">Belum ada sesi direkod.</div>`}
    <button class="addsub" data-addses="${p.id}">＋ Tambah sesi</button>
    <div class="g2" style="margin-top:11px">
      ${p.stage!=="muhib"?fld("Berminat sertai usrah? (syarat tarsyih)",`<div class="toggle g"><button data-tgl="${p.id}|minatUsrah|Ya" class="${p.minatUsrah==="Ya"?"on":""}">Ya</button><button data-tgl="${p.id}|minatUsrah|Belum" class="${p.minatUsrah!=="Ya"?"on":""}">Belum</button></div>`):""}
      ${p.stage!=="muhib"?fld("Bukan musuh Islam? (syarat tarsyih)",`<div class="toggle"><button data-tgl="${p.id}|bukanMusuh|Ya" class="${p.bukanMusuh!=="Tidak"?"on":""}">Ya</button><button data-tgl="${p.id}|bukanMusuh|Tidak" class="${p.bukanMusuh==="Tidak"?"on":""}">Tidak</button></div>`):""}
      ${fld("Berminat jadi AJK?",`<div class="toggle"><button data-tgl="${p.id}|minatAJK|Ya" class="${p.minatAJK==="Ya"?"on":""}">Ya</button><button data-tgl="${p.id}|minatAJK|Tidak" class="${p.minatAJK!=="Ya"?"on":""}">Tidak</button></div>`)}
    </div></div>`;
}

function Ts(pid,sid,f,v,type){return `<input data-ses="${pid}|${sid}" data-f="${f}" type="${type||"text"}" value="${esc(v)}">`;}
function SESpd(pid,sid,f,v){const opts=pdOptions();const cur=(v&&!opts.includes(v))?`<option selected>${esc(v)}</option>`:"";return `<select data-ses="${pid}|${sid}" data-f="${f}"><option value="">— PD —</option>${cur}${opts.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`;}
function SELf2(pid,sid,f,v,opts){return `<select data-ses="${pid}|${sid}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function muhSection(p){
  const b=bpmy(p);
  const sum=`<div class="bsum"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bcd0f5;font-weight:800">Gambaran Fokus Tarbiah MHB</div><div class="big">${Math.round(b.pct*100)}%</div></div><span class="passpill ${b.pass?"ok":"no"}">${b.pass?"LULUS ≥50%":"BELUM 50%"}</span></div>
    <table>${SUMMARY_ORDER.map(cid=>{const c=b.cats.find(x=>x.id===cid);return `<tr><td>${esc(c.name)}</td><td>${Math.round(c.score/BPMY_MAX*100)}% / ${Math.round(c.max/BPMY_MAX*100)}%</td></tr>`;}).join("")}</table></div>`;
  const cats=BPMY.map(c=>{const cs=b.cats.find(x=>x.id===c.id);
    return `<div class="bcat"><h4>${esc(c.name)}<span class="cp">${Math.round(cs.score/BPMY_MAX*100)}% / ${Math.round(cs.max/BPMY_MAX*100)}%</span></h4>
      ${c.items.map(it=>`<div class="bitem"><div class="bt">${esc(it.t)} <span class="w">(×${it.w})</span> ${it.wajib?'<span class="wajib">WAJIB</span>':''}</div>
        <div class="scale">${[0,1,2,3,4,5].map(v=>`<button class="scb ${(p.bpmy&&p.bpmy[it.id]||0)===v?"sel":""}" data-score="${p.id}|${it.id}|${v}">${v}</button>`).join("")}</div></div>`).join("")}
      ${fld("Remarks — "+c.name,TA(p.id,"rmk_"+c.id,(p.remarks||{})[c.id]||"","Catatan ciri ini…"))}
    </div>`;}).join("");
  const extra=`<div class="grp"><h3>Butiran tambahan (kenaikan MAY)</h3>${fld("Program jadi AJK",TA(p.id,"programAJK",p.programAJK,"Senarai program di mana beliau jadi AJK…"))}${fld("Tarikh jadi muhib",T(p.id,"tarikhMuhib",p.tarikhMuhib,"","date"))}</div>`;
  return `<div class="grp"><h3>Borang Pencalonan Muayyid (BPMy)</h3><div class="hint">Skor setiap item 0–5 (× pemberat). Lulus jika jumlah ≥ 50%. <button class="btn2" data-bpmyxl="${p.id}" style="margin-top:6px">⭳ Export BPMy (Excel)</button></div>${sum}${cats}</div>${extra}`;
}

function viewMinit(){
  const open=[];S.meetings.forEach(m=>m.items.forEach(it=>{if(it.status!=="Selesai")open.push({m,it});}));
  const ob=`<details class="stats" ${openExp?"open":""}><summary style="cursor:pointer;font-weight:800;color:var(--blue)">Tindakan (${open.length})</summary><div style="margin-top:8px">`+
    (open.length?open.map(({m,it})=>`<div class="tind"><div class="tind-l"><div class="tind-pic">${esc(it.pic||"(PIC)")}</div><div class="tind-task">${esc(it.tugasan||"(tugasan)")}</div><div class="tind-from">dari: ${esc(m.tajuk||"(mesyuarat)")}</div></div><div class="tind-r"><div class="tind-due">${esc(it.due||"—")}</div><select data-sumstat="${m.id}|${it.id}" class="tind-sel">${["To do","In progress","Selesai"].map(s=>`<option${s===(it.status||"To do")?" selected":""}>${s}</option>`).join("")}</select></div></div>`).join(""):`<div class="hint">Tiada tindakan.</div>`)+`</div></details>`;
  const list=S.meetings.length?S.meetings.map(meetCard).join(""):`<div class="empty"><b>Belum ada mesyuarat</b></div>`;
  return `<div class="bar"><button class="add" id="addMeetBtn" style="flex:1">＋ Mesyuarat baharu</button></div>${ob}<div class="rows">${list}</div>`;
}

  if(wasMode==="cal")return toggle+calLegend()+calendarHTML()+calDayDetail();
  const MM=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  const entries=[];S.wasilah.forEach(w=>entries.push({t:"w",d:w.tarikh||"",o:w}));(S.holidays||[]).forEach(x=>entries.push({t:"h",d:x.start||"",o:x}));
  if(!entries.length)return toggle+`<div class="rows"><div class="empty"><b>Belum ada program</b></div></div>`;
  const groups={};entries.forEach(e=>{const mk=(e.d||"").slice(0,7)||"zzzz";(groups[mk]=groups[mk]||[]).push(e);});
  const body=Object.keys(groups).sort().map(mk=>{const items=groups[mk].slice().sort((a,b)=>(a.d||"~").localeCompare(b.d||"~"));const lbl=mk==="zzzz"?"Tiada tarikh":(MM[(+mk.slice(5,7))-1]+" "+mk.slice(0,4));return `<div class="grouphdr">${lbl}<span class="gc">${items.length}</span></div>`+items.map(e=>e.t==="w"?wasCard(e.o):holCard(e.o)).join("");}).join("");

}
function calLegend(){const L=(c,t)=>`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></span>${t}</span>`;return `<div class="hint" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px">${L("var(--blueb)","Akhawat")}${L("#1f8f80","Campur")}${L("var(--red)","Cuti umum")}${L("var(--purple)","Cuti semester")}${L("var(--amber)","Study week")}<span>\uD83C\uDF82 Hari lahir</span></div>`;}

function monShort(iso){const MS=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];const m=+((iso||"").slice(5,7));return m?MS[m-1]:"";}

function SELw(id,f,v,opts){return `<select data-wed="${id}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function wtgl(id,f,v,opts){return `<div class="toggle${opts.length>2?" g":""}">`+opts.map(o=>`<button data-wtgl="${id}|${f}|${esc(o)}" class="${v===o?"on":""}">${esc(o)}</button>`).join("")+`</div>`;}
function holClass(j){return j==="Cuti Umum"?"hol-umum":j==="Cuti Semester"?"hol-sem":j==="Study Week"?"hol-study":"hol-lain";}
function bdayOf(p){if(p&&p.tarikhLahir){const m=+p.tarikhLahir.slice(5,7),d=+p.tarikhLahir.slice(8,10);if(m>=1&&m<=12&&d>=1&&d<=31)return{mm:m,dd:d};}return null;}
function icBirthday(ic){const d=(ic||"").replace(/\D/g,"");if(d.length<6)return null;const mm=+d.slice(2,4),dd=+d.slice(4,6);if(mm<1||mm>12||dd<1||dd>31)return null;return{mm:mm,dd:dd};}
function calendarHTML(){
  const y=calDate.getFullYear(),mo=calDate.getMonth();
  const first=new Date(y,mo,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const months=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  const dows=["Isn","Sel","Rab","Kha","Jum","Sab","Ahd"];
  const bdays=S.people.map(p=>({b:bdayOf(p),n:(p.nama||"").split(/\s+/)[0]||"?"})).filter(x=>x.b);
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);const out=d.getMonth()!==mo;const cm=d.getMonth()+1,cd=d.getDate();
    const hs=(S.holidays||[]).filter(x=>x.start&&iso>=x.start&&iso<=(x.end||x.start));
    const evs=S.wasilah.filter(w=>w.tarikh&&iso>=w.tarikh&&iso<=(w.tarikhTamat||w.tarikh));
    const bd=bdays.filter(x=>x.b.mm===cm&&x.b.dd===cd);
    cells+=`<div class="cald${out?" out":""}${selDate===iso?" sel":""}" data-calday="${iso}"><div class="dn">${d.getDate()}</div>`+hs.map(x=>`<div class="cev ${holClass(x.jenis)}">${esc(x.nama||"cuti")}</div>`).join("")+bd.map(x=>`<div class="cev bday">\uD83C\uDF82 ${esc(x.n)}</div>`).join("")+evs.map(w=>`<div class="cev pes-${(w.peserta==="Campur")?"campur":"akhawat"}" title="${esc(w.nama)} · ${esc(w.status)}${w.kolab?" · kolab":""}">${esc(w.nama||"program")}</div>`).join("")+`</div>`;}
  return `<div class="caltop"><button class="btn2" data-calnav="-1" aria-label="Bulan sebelum">‹</button><h3>${months[mo]} ${y}</h3><button class="btn2" data-calnav="1" aria-label="Bulan seterusnya">›</button></div>
    <div class="cal">${dows.map(d=>`<div class="calh">${d}</div>`).join("")}${cells}</div>`;
}
function calDayDetail(){
  if(!selDate)return `<div class="hint" style="margin-top:10px">Tekan mana-mana tarikh pada kalendar untuk lihat butiran hari itu.</div>`;
  const iso=selDate;const dt=new Date(iso+"T00:00:00");
  const mms=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];
  const hdr=`${dt.getDate()} ${mms[dt.getMonth()]} ${dt.getFullYear()}`;
  const cm=dt.getMonth()+1,cd=dt.getDate();
  const hs=(S.holidays||[]).filter(x=>x.start&&iso>=x.start&&iso<=(x.end||x.start));
  const ws=(S.wasilah||[]).filter(w=>w.tarikh&&iso>=w.tarikh&&iso<=(w.tarikhTamat||w.tarikh));
  const bd=(S.people||[]).map(x=>({b:bdayOf(x),n:x.nama})).filter(x=>x.b&&x.b.mm===cm&&x.b.dd===cd);
  let items="";
  hs.forEach(x=>{const c=x.jenis==="Cuti Umum"?"var(--red)":x.jenis==="Cuti Semester"?"var(--purple)":x.jenis==="Study Week"?"var(--amber)":"var(--muted)";items+=`<div class="dd-item"><span class="dd-dot" style="background:${c}"></span><div><b>${esc(x.nama||"Cuti")}</b><div class="dd-sub">${esc(x.jenis)}</div></div></div>`;});
  ws.forEach(w=>items+=`<div class="dd-item" data-wopen="${w.id}" style="cursor:pointer"><span class="dd-dot" style="background:${(w.peserta==="Campur")?"#1f8f80":"var(--blueb)"}"></span><div style="flex:1"><b>${esc(w.nama||"(program)")}</b><div class="dd-sub">${esc(w.peserta||"Akhawat")}${w.tarikhTamat&&w.tarikhTamat!==w.tarikh?" · "+esc(w.tarikh)+" → "+esc(w.tarikhTamat):""} · ${esc(w.status)}${w.kolab?" · kolab: "+esc(w.kolabNama||"ya"):""}</div></div><span class="chev">›</span></div>`);
  bd.forEach(x=>items+=`<div class="dd-item"><span class="dd-dot" style="background:#c2367a"></span><div><b>\uD83C\uDF82 ${esc(x.n)}</b><div class="dd-sub">Hari lahir</div></div></div>`);
  if(!items)items=`<div class="hint">Tiada program atau cuti pada tarikh ini.</div>`;
  return `<div class="dayd"><div style="font-weight:800;margin-bottom:8px;color:var(--blue)">Butiran · ${hdr}</div>${items}</div>`;
}

/* ---- import names ---- */
function importNames(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const addRows=rows=>{ // rows: array of objects keyed by header (lowercased)
    const cands=[];
    rows.forEach(o=>{const nama=o.nama||o.name||o["nama penuh"]||"";if(!String(nama).trim())return;
      const p=newPerson((String(o["status tarbiyyah"]||o.peringkat||o.stage||"mutabaah")).trim().toLowerCase());p._open=false;
      p.nama=titleCase(String(nama).trim());
      p.universiti=o.universiti||o["institut pengajian tinggi (ipt)"]||o.ipt||"";
      p.bidang=titleCase(o.bidang||o.kursus||o["bidang pengajian"]||"");
      p.tahap=titleCase(o["tahap pengajian"]||o.tahap||"");
      p.tahunMasuk=String(o["tahun kemasukan ke ipt"]||o["tahun kemasukan"]||o.tahunmasuk||"");
      const _ic=String(o.ic||o["no kad pengenalan"]||o.kp||"");const _tl=String(o["tarikh lahir"]||o["birth date"]||o["dob"]||"");if(/\d{4}-\d{2}-\d{2}/.test(_tl))p.tarikhLahir=_tl.slice(0,10);else if(_ic){const _b=icBirthday(_ic);if(_b){const _g=_ic.replace(/\D/g,"");const _yy=+_g.slice(0,2),_yr=_yy<30?2000+_yy:1900+_yy;p.tarikhLahir=_yr+"-"+String(_b.mm).padStart(2,"0")+"-"+String(_b.dd).padStart(2,"0");}}
      p.statusAhli=(o["status ahli"]?(/^ya/i.test(String(o["status ahli"]))?"Ya":"Belum"):((o.keahlian||o["no keahlian"]||o.nokeahlian)?"Ya":"Belum"));
      p.email=String(o.email||o.emel||"").trim().toLowerCase();
      p.negeri=o.negeri||"";
      p.pd1=o.pd||o.pd1||o["nama murobbi"]||o.murobbi||"";p.pd2=o.pd2||"";
      p.telefon=fmtPhone(o.telefon||o["no. telefon"]||o["no telefon"]||o.phone||"");
      p.tahunPSPB=String(o.tahun||o["tahun pspb"]||o.tahunpspb||"2026");
      p.minatAJK=/^ya/i.test(String(o["berminat untuk menjadi ajk pembina?"]||o["minat ajk"]||o.minatajk||""))?"Ya":"Tidak";
      p.minatUsrah=/^ya/i.test(String(o["berminat untuk menyertai usrah?"]||o["minat usrah"]||o.minatusrah||""))?"Ya":"Belum";
      if(!STAGES.find(s=>s.id===p.stage))p.stage="mutabaah";
      cands.push(p);});
    if(!cands.length){toast("Tiada nama sah dijumpai dalam fail");return;}
    const nrm=s=>(s||"").trim().toLowerCase();
    const existing=new Set(S.people.filter(x=>!x.arsip).map(x=>nrm(x.nama)));const seen=new Set();const fresh=[],dups=[];
    cands.forEach(p=>{const key=nrm(p.nama);if(existing.has(key)||seen.has(key))dups.push(p);else{fresh.push(p);seen.add(key);}});
    if(!confirm("Import "+cands.length+" baris:\n\u2022 "+fresh.length+" nama baharu\n\u2022 "+dups.length+" kemungkinan duplikat (nama sama) \u2014 akan dilangkau\n\nTeruskan tambah "+fresh.length+" nama baharu?"))return;
    fresh.forEach(p=>{if(p.pd1&&!S.pds.includes(p.pd1))S.pds.push(p.pd1);if(p.pd2&&!S.pds.includes(p.pd2))S.pds.push(p.pd2);if(p.universiti&&!S.universities.includes(p.universiti))S.universities.push(p.universiti);S.people.push(p);});
    S.pds.sort();S.universities.sort();save();render();toast(fresh.length+" nama ditambah"+(dups.length?" \u00b7 "+dups.length+" duplikat dilangkau":""));
  };
  const r=new FileReader();
  if(ext==="csv"){r.onload=()=>{addRows(parseCSV(r.result));};r.readAsText(file);}
  else{ if(typeof XLSX==="undefined"){toast("Pustaka Excel tidak dimuat — guna CSV atau sambung internet");return;}
    r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const arr=XLSX.utils.sheet_to_json(ws,{defval:""});
      const norm=arr.map(o=>{const n={};Object.keys(o).forEach(k=>n[String(k).trim().toLowerCase()]=o[k]);return n;});addRows(norm);}catch(err){toast("Gagal baca Excel");}};r.readAsArrayBuffer(file);}
}
function parseCSV(txt){txt=txt.replace(/^\ufeff/,"");const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const split=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===","&&!q){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out;};
  const head=split(lines[0]).map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(l=>{const c=split(l);const o={};head.forEach((h,i)=>o[h]=(c[i]||"").trim());return o;});}

function exportCSV(){const head=["Nama","Peringkat","Tahun PSPB","Status ahli","Tarikh lahir","Email","Status","IPT","Kolej","Bidang","Tahap","Tahun masuk IPT","Telefon","PD1","PD2","Poskod","Negeri","Tajmik","Sesi","Minat usrah","Minat AJK","BPMy %","Keadaan"];
  const rows=S.people.map(p=>[p.nama,stageLabel(p.stage),p.tahunPSPB,p.statusAhli,p.tarikhLahir,p.email,p.kerja,p.universiti,p.kolej,p.bidang,p.tahap,p.tahunMasuk,p.telefon,p.pd1,p.pd2,p.poskod,p.negeri,p.tajmik,sesCount(p),p.minatUsrah,p.minatAJK,p.stage==="muhib"?Math.round(bpmy(p).pct*100):"",statusOf(p).t].map(cc).join(","));
  dl(`KitPD-Keahlian-${today()}.csv`,"\ufeff"+[head.join(","),...rows].join("\n"),"text/csv");toast("CSV dimuat turun");}

function exportBPMy(p){if(!p)return;const b=bpmy(p);
  const aoa=[["BORANG PENCALONAN MUAYYID"],["Nama :",p.nama||""],["Tarikh akhir kemaskini :",today()],[],
    ["GAMBARAN FOKUS TARBIAH MHB","% CAPAI","% PENUH"]];
  SUMMARY_ORDER.forEach(cid=>{const c=b.cats.find(x=>x.id===cid);aoa.push([c.name,(c.score/BPMY_MAX),(c.max/BPMY_MAX)]);});
  aoa.push(["TOTAL",b.pct,1]);aoa.push(["LULUS (≥50%)?",b.pass?"YA":"BELUM"]);aoa.push([]);
  aoa.push(["NO","PERKARA","PENCAPAIAN (0-5)","PEMBERAT","SKOR"]);
  BPMY.forEach(c=>{aoa.push([c.id.toUpperCase(),c.name.toUpperCase(),"","",""]);
    c.items.forEach(it=>{const pen=(p.bpmy&&p.bpmy[it.id])||0;aoa.push([it.id,it.t+(it.wajib?" (WAJIB)":""),pen,it.w,pen*it.w]);});});
  aoa.push([]);aoa.push(["","JUM SKOR","","",b.total+" / "+BPMY_MAX]);
  if(typeof XLSX==="undefined"){dl(`BPMy-${(p.nama||"Nama")}-${today()}.csv`,"\ufeff"+aoa.map(r=>r.map(cc).join(",")).join("\n"),"text/csv");toast("BPMy CSV dimuat turun");return;}
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=[{wch:8},{wch:48},{wch:16},{wch:10},{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"BPMy-"+((p.nama||"Nama").slice(0,20)));
  XLSX.writeFile(wb,`BPMy-${(p.nama||"Nama").replace(/\s+/g,"_")}-${today()}.xlsx`);toast("BPMy Excel dimuat turun");}

/* ---- normalize + holidays ---- */
function normalizeS(){S.people=S.people||[];S.meetings=S.meetings||[];S.wasilah=S.wasilah||[];S.claims=S.claims||[];S.universities=(S.universities&&S.universities.length)?S.universities:["UiTM Shah Alam","UiTM Puncak Perdana","MSU"];S.pds=S.pds||[];S.kolej=S.kolej||[];S.roster=S.roster||[];S.holidays=S.holidays||[];S._del=S._del||{};S.pdList=S.pdList||[];if(!S._pdSeeded){const have=new Set(S.pdList.map(x=>(x.nama||"").toLowerCase()));const nm=new Set(S.pds||[]);S.people.forEach(p=>{if(p.pd1)nm.add(p.pd1);if(p.pd2)nm.add(p.pd2);});nm.forEach(n=>{if(n&&!have.has(n.toLowerCase())){S.pdList.push({id:uid("pd_"),nama:n,ipt:"",_upd:1});have.add(n.toLowerCase());}});S._pdSeeded=true;}S.people.forEach(p=>{if(p&&p.ic){const b=icBirthday(p.ic);if(b&&!p.tarikhLahir){const dg=(p.ic||"").replace(/\D/g,"");const yy=+dg.slice(0,2);const yr=yy<30?2000+yy:1900+yy;p.tarikhLahir=yr+"-"+String(b.mm).padStart(2,"0")+"-"+String(b.dd).padStart(2,"0");}delete p.ic;}});seedHolidays();}
function seedHolidays(){if(S._holSeeded)return;const seed=[["Tahun Baharu","2026-01-01"],["Hari Pekerja","2026-05-01"],["Hari Kebangsaan","2026-08-31"],["Hari Malaysia","2026-09-16"],["Keputeraan Sultan Selangor","2026-12-11"],["Krismas","2026-12-25"],["Tahun Baharu","2027-01-01"],["Hari Pekerja","2027-05-01"],["Hari Kebangsaan","2027-08-31"],["Hari Malaysia","2027-09-16"],["Keputeraan Sultan Selangor","2027-12-11"],["Krismas","2027-12-25"]];seed.forEach(([n,dd])=>S.holidays.push({id:"hs_"+dd+"_"+n.replace(/\s+/g,""),nama:n,jenis:"Cuti Umum",start:dd,end:"",_open:false,_upd:1}));S._holSeeded=true;}
function newHoliday(){return{id:uid("h_"),nama:"",jenis:"Cuti Semester",start:today(),end:"",_open:true,_upd:Date.now()};}
function getH(id){return(S.holidays||[]).find(x=>x.id===id);}

/* ---- sync + login ---- */
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwrMS4lqkxOyeRjbklY7_BmlEwnSNROL3Cw2mAExURKJ0cUxJC9kAh7c7WssGC0w30b/exec"; /* ADMIN: ganti dgn URL /exec Apps Script (sekali sahaja) */
let cfg={url:APPS_SCRIPT_URL,name:""};const CFGKEY="kitpd_cfg";
function loadCfg(){try{const v=localStorage.getItem(CFGKEY);if(v){const o=JSON.parse(v);if(o.url)cfg.url=o.url;if(o.name)cfg.name=o.name;}}catch(e){} if(!cfg.url)cfg.url=APPS_SCRIPT_URL;}
function saveCfg(){try{localStorage.setItem(CFGKEY,JSON.stringify({url:cfg.url,name:cfg.name}));}catch(e){}}
let SYNC={ok:false,code:"",busy:false}; let dirty=false; let pollT=null; let lastSyncAt=0;
function setSyncUI(saving){const el=document.getElementById("syncPill");if(!el)return;if(!SYNC.ok){el.style.display="none";return;}el.style.display="block";if(saving){el.textContent="Menyegerak…";el.classList.add("on");}else{el.classList.remove("on");el.textContent=lastSyncAt?("✓ Segerak "+new Date(lastSyncAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})):"";}}
function stamp(o){if(o)o._upd=Date.now();}
function recFromDataset(d){d=d||{};
  if(d.ed)return get(d.ed);
  if(d.tgl)return get(d.tgl.split("|")[0]);
  if(d.score)return get(d.score.split("|")[0]);
  if(d.ses)return get(d.ses.split("|")[0]);
  if(d.addses)return get(d.addses);
  if(d.delses)return get(d.delses.split("|")[0]);
  if(d.promote)return get(d.promote);
  if(d.med)return getM(d.med);
  if(d.mit)return getM(d.mit.split("|")[0]);
  if(d.addit)return getM(d.addit);
  if(d.delit)return getM(d.delit.split("|")[0]);
  if(d.done)return getM(d.done.split("|")[0]);
  if(d.hadir)return getM(d.hadir.split("|")[0]);
  if(d.addhadir)return getM(d.addhadir);
  if(d.mtog)return getM(d.mtog);
  if(d.wed)return getW(d.wed);
  if(d.hed)return getH(d.hed);
  if(d.ced)return getC(d.ced);
  if(d.uplbtn){const a=d.uplbtn.split("|");return a[0]==="claim"?getC(a[1]):get(a[1]);}
  if(d.rmatt){const a=d.rmatt.split("|");return a[0]==="claim"?getC(a[1]):get(a[1]);}
  return null;}
function stampActive(){try{const a=document.activeElement;if(a)stamp(recFromDataset(a.dataset||{}));}catch(e){}}
function isEditing(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
async function apiGet(code){const u=cfg.url+(cfg.url.indexOf("?")>-1?"&":"?")+"action=get&code="+encodeURIComponent(code);const r=await fetch(u);return await r.json();}
async function apiSave(){const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",code:SYNC.code,by:cfg.name,data:JSON.stringify(S)})});return await r.json();}
function sig(x){try{const o=Object.assign({},x);delete o._localSavedAt;return JSON.stringify(o);}catch(e){return Math.random()+"";}}
async function syncNow(){if(!SYNC.ok||!cfg.url||!SYNC.code||SYNC.busy)return;SYNC.busy=true;setSyncUI(true);try{const r=await apiSave();if(r&&r.ok){dirty=false;lastSyncAt=Date.now();if(r.data&&!isEditing()){try{const before=sig(S);S=JSON.parse(r.data);normalizeS();S._localSavedAt=(r.savedAt||"");persistLocal();if(sig(S)!==before)render();}catch(e){}}}}catch(e){}SYNC.busy=false;setSyncUI(false);}
function pushSync(){syncNow();}
async function pullMerge(){if(!SYNC.ok||dirty||SYNC.busy||isEditing())return;setSyncUI(true);try{const r=await apiGet(SYNC.code);if(r&&r.ok&&r.data){const before=sig(S);S=JSON.parse(r.data);normalizeS();S._localSavedAt=(r.savedAt||"");persistLocal();lastSyncAt=Date.now();if(sig(S)!==before)render();}}catch(e){}setSyncUI(false);}
function startPolling(){if(pollT)clearInterval(pollT);pollT=setInterval(pullMerge,25000);}
async function pullNow(){if(!SYNC.ok){toast("Log masuk dahulu");return;}try{const r=await apiGet(SYNC.code);if(r&&r.ok){if(r.data){S=JSON.parse(r.data);normalizeS();S._localSavedAt=(r.savedAt||"");persistLocal();}render();toast("Data terkini ditarik");}else toast("Gagal menarik data");}catch(e){toast("Tidak dapat menyambung");}}
function logout(){SYNC={ok:false,code:"",busy:false};dirty=false;if(pollT)clearInterval(pollT);try{localStorage.removeItem(KEY);}catch(e){}S={};normalizeS();render();gateShow();toast("Telah log keluar");}
function setGateModal(open){["header","nav","main"].forEach(sel=>{const el=document.querySelector(sel);if(el)el.inert=open;});$("#gate").setAttribute("aria-hidden",String(!open));}
function gateShow(){const g=$("#gate");setGateModal(true);g.style.display="flex";const u=$("#gUrl");if(u)u.value=cfg.url||"";$("#gName").value=cfg.name||"";$("#gErr").textContent="";setTimeout(()=>$("#gName")?.focus(),0);}
function gateHide(){setGateModal(false);$("#gate").style.display="none";}
function bindGate(){const s=$("#gSave");if(s)s.addEventListener("click",()=>{cfg.url=$("#gUrl").value.trim()||APPS_SCRIPT_URL;saveCfg();toast("URL disimpan");});const o=$("#gOffline");if(o)o.addEventListener("click",()=>{gateHide();toast("Mod luar talian");});$("#gLogin").addEventListener("click",doLogin);const eye=$("#gEye");if(eye)eye.addEventListener("click",()=>{const i=$("#gCode");const showing=i.type==="password";i.type=showing?"text":"password";eye.innerHTML=showing?"<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24\"/><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"/></svg>":"<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>";});const gc=$("#gCode");if(gc)gc.addEventListener("keydown",ev=>{if(ev.key==="Enter")doLogin();});}
async function doLogin(){const name=$("#gName").value.trim(),code=$("#gCode").value.trim();if($("#gUrl"))cfg.url=$("#gUrl").value.trim()||cfg.url||APPS_SCRIPT_URL;cfg.name=name;saveCfg();$("#gErr").textContent="";
  if(!cfg.url||cfg.url.indexOf("PASTE")>-1){$("#gErr").textContent="URL Apps Script belum ditetapkan oleh admin.";return;}
  if(!name){$("#gErr").textContent="Masukkan nama anda.";return;}
  if(!code){$("#gErr").textContent="Masukkan kod akses.";return;}
  const btn=$("#gLogin");btn.textContent="Menyambung…";
  try{const res=await apiGet(code);if(res&&res.ok){SYNC.ok=true;SYNC.code=code;await syncNow();startPolling();gateHide();render();toast("Log masuk berjaya");}
    else{$("#gErr").textContent=(res&&res.error)?("Gagal: "+res.error):"Kod salah atau URL tidak sah.";}}
  catch(e){$("#gErr").textContent="Tidak dapat menyambung. Semak internet.";}
  btn.textContent="Log masuk";}

/* ---- upload lampiran ke Drive (via Apps Script) ---- */
async function uploadFile(file,cb){
  if(!SYNC.ok||!cfg.url||!SYNC.code){toast("Log masuk & sync dahulu untuk muat naik");return;}
  if(file.size>5*1024*1024){toast("Fail terlalu besar (maks 5MB)");return;}
  let b64;try{b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}catch(e){toast("Gagal baca fail");return;}
  toast("Memuat naik…");
  try{const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"upload",code:SYNC.code,filename:file.name,mime:file.type||"application/octet-stream",data:b64})});
    const res=await r.json();
    if(res&&res.ok&&res.url){cb({name:res.name||file.name,url:res.url});toast("Berjaya dimuat naik");}
    else toast((res&&res.error)?("Gagal: "+res.error):"Muat naik gagal");
  }catch(e){toast("Tidak dapat menyambung");}
}
function pickAndUpload(kind,id){const inp=document.createElement("input");inp.type="file";inp.accept="image/*,.pdf";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)uploadFile(f,att=>addAttachment(kind,id,att));};inp.click();}
function addAttachment(kind,id,att){if(kind==="person"){const p=get(id);if(p){p.lampiran=p.lampiran||[];p.lampiran.push(att);stamp(p);save();render();}}else if(kind==="claim"){const c=getC(id);if(c){c.files=c.files||[];c.files.push(att);stamp(c);save();render();}}}

(async function(){await load();render();loadCfg();bindGate();if(cfg.url)gateShow();})();
</script>
