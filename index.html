<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3b8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Penjejak PSM · PEMBINA Shah Alam</title>
<style>
  :root{
    --blue:#0a3b8c;--blue-ink:#072a63;--blue-2:#1657c4;--yellow:#ffce33;
    --ink:#0e1726;--muted:#5b6b86;--line:#e3e9f4;--paper:#eef2fa;--card:#fff;
    --green:#1f9d55;--green-s:#e4f6ec;--amber:#dd9021;--amber-s:#fcf1dc;
    --blueb:#3f74d6;--blue-s:#e4ecfb;--grey-s:#eef1f7;--red:#d3453f;--red-s:#fbe6e5;
    --shadow:0 1px 2px rgba(9,30,66,.06),0 6px 18px rgba(9,30,66,.07);
    --font:ui-sans-serif,system-ui,"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  .app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--paper)}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--blue-ink),var(--blue) 60%,var(--blue-2));
    color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
  .hin{max-width:1060px;margin:0 auto}
  .hrow{display:flex;align-items:center;gap:11px}
  .logo{background:#fff;border-radius:11px;padding:6px;flex:0 0 auto;box-shadow:0 2px 8px rgba(7,42,99,.2);display:grid;place-items:center}
  .logo img{height:38px;width:auto;display:block}
  .htxt{flex:1;min-width:0}
  .htxt .e{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#bcd0f5;font-weight:700}
  .htxt h1{margin:1px 0 0;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;height:38px;min-width:38px;
    padding:0 10px;border-radius:10px;font-size:15px;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    justify-content:center;text-decoration:none;font-weight:700}
  .hbtn .lbl{font-size:13px}
  .menu{position:relative}
  .menu-pop{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:6px;min-width:210px;display:none;z-index:30}
  .menu-pop.show{display:block}
  .menu-pop button{display:flex;width:100%;text-align:left;gap:9px;align-items:center;background:none;border:none;
    padding:11px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)}
  .menu-pop button:hover{background:var(--paper)}
  .menu-pop hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
  .menu-pop button.danger{color:var(--red)}

  .viewseg{display:flex;background:var(--card);margin:12px 14px 0;border:1px solid var(--line);border-radius:12px;
    padding:4px;box-shadow:var(--shadow);max-width:1060px}
  .viewseg button{flex:1;border:none;background:none;padding:11px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--muted)}
  .viewseg button.active{background:var(--blue);color:#fff}

  .pipe{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 3px;scrollbar-width:none;max-width:1060px;margin:0 auto}
  .pipe::-webkit-scrollbar{display:none}
  .pstep{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:22px;
    font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  .pstep .c{background:var(--paper);border-radius:10px;padding:1px 7px;font-size:12px;font-weight:800}
  .pstep.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pstep.active .c{background:var(--yellow);color:var(--blue-ink)}

  .tools{display:flex;gap:9px;padding:12px 14px 4px;max-width:1060px;margin:0 auto}
  .search{flex:1;position:relative}
  .search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px 11px 36px;background:#fff;box-shadow:var(--shadow)}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
  .add{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:0 16px;font-weight:800;font-size:14px;
    box-shadow:var(--shadow);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .add:active{background:var(--blue-2)}
  .summary{padding:6px 14px 2px;font-size:12.5px;color:var(--muted);max-width:1060px;margin:0 auto}
  .summary b{color:var(--ink)} .summary .hi{color:var(--green);font-weight:700}

  .list{display:grid;grid-template-columns:1fr;gap:10px;padding:8px 14px 100px;max-width:1060px;margin:0 auto}
  .mlist{display:flex;flex-direction:column;gap:10px;padding:4px 14px 100px;max-width:820px;margin:0 auto}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}
  .phead{display:flex;align-items:center;gap:11px;padding:13px 14px}
  .pav{width:40px;height:40px;border-radius:11px;background:var(--paper);display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:15px;flex:0 0 auto}
  .pmid{flex:1;min-width:0}
  .pname{font-weight:800;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pname.empty{color:var(--muted);font-style:italic;font-weight:600}
  .pmeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .chev{color:var(--muted);font-size:13px;width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto;transition:transform .2s}
  .pcard.open .chev{transform:rotate(180deg)}
  .badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:0 0 auto;max-width:130px;overflow:hidden;text-overflow:ellipsis}
  .b-g{background:var(--green-s);color:var(--green)}.b-a{background:var(--amber-s);color:var(--amber)}
  .b-b{background:var(--blue-s);color:var(--blueb)}.b-n{background:var(--grey-s);color:var(--muted)}
  .pbody{display:none;border-top:1px solid var(--line);padding:14px;background:#fcfdff}
  .pcard.open .pbody{display:block}
  .fld{margin-bottom:12px}.fld:last-child{margin-bottom:0}
  .fld label{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue-2)}
  .fld textarea{resize:vertical;min-height:44px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .att{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:700;font-size:12px;color:var(--muted);flex:1 1 calc(25% - 7px);min-width:56px;text-align:center;transition:.12s}
  .chip small{display:block;font-size:9.5px;font-weight:600;opacity:.7;margin-bottom:2px}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .hadir-line{font-size:12px;color:var(--muted);margin-top:8px}.hadir-line b{color:var(--ink)}

  .actions{display:flex;gap:9px;margin-top:15px;padding-top:13px;border-top:1px dashed var(--line)}
  .promote{flex:1;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14px;background:var(--paper);color:var(--blue)}
  .promote.ready{background:var(--yellow);color:var(--blue-ink);box-shadow:0 2px 10px rgba(255,206,51,.5)}
  .promote:active{opacity:.85}
  .del{border:1px solid var(--red-s);background:#fff;color:var(--red);border-radius:11px;padding:12px 15px;font-weight:700;font-size:14px;flex:0 0 auto}

  /* minit & tindakan */
  .openbox{margin:12px 14px 0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;max-width:820px}
  .openhead{display:flex;align-items:center;gap:9px;padding:13px 15px;font-weight:800;font-size:14px}
  .ocount{background:var(--amber-s);color:var(--amber);border-radius:20px;padding:2px 9px;font-size:12px}
  .openhead .cv{margin-left:auto;color:var(--muted);font-size:12px}
  .openlist{display:none;border-top:1px solid var(--line);padding:5px 8px 8px}
  .openlist.show{display:block}
  .orow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid var(--paper)}
  .orow:last-child{border-bottom:none}
  .ol{flex:1;min-width:0}.ol b{font-size:13.5px}
  .osub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .odone{border:1px solid var(--green);background:var(--green-s);color:var(--green);border-radius:9px;width:36px;height:36px;font-size:15px;flex:0 0 auto;font-weight:800}
  .oempty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
  .ahead{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:15px 0 8px}
  .aitem{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;background:#fff}
  .aitem.done{opacity:.55}
  .aitem>input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;margin-bottom:8px}
  .aitem .two input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
  .arow{display:flex;gap:8px;margin-top:8px}
  .arow select{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}
  .delmini{border:1px solid var(--red-s);background:#fff;color:var(--red);border-radius:9px;width:44px;flex:0 0 auto;font-weight:800}
  .addsub{width:100%;border:1px dashed var(--line);background:var(--paper);color:var(--blue);border-radius:10px;padding:11px;font-weight:800;font-size:13.5px}

  .empty-state{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px}
  .empty-state .big{font-size:34px;margin-bottom:8px}.empty-state b{color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:60;box-shadow:var(--shadow);max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=file]{display:none}

  @media(min-width:760px){
    .app{max-width:1060px}
    .list{grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 20px 100px}
    .pcard.open{grid-column:1/-1}
  }
</style>
</head>

<script>
"use strict";
const KEY="penjejak_psm_sa";
const STAGES=[{id:"takungan",label:"Takungan"},{id:"mutabaah",label:"Mutabaah"},{id:"muhib",label:"Muhib"},{id:"muayyid",label:"Muayyid"}];
const CONTACT=["Dah masuk group","PD dah contact","dah inform PD","Tak respond","Tiada whatsapp"];
const MUT_SESS=["Okt·M1","Okt·M2","Okt·M3","Okt·M4","Nov·M1","Nov·M2","Nov·M3","Nov·M4"];
const MUH_MTH=["Nov","Dis","Jan","Feb","Mac","Apr","Mei"];
const MEET_TYPES=["LMM","LMH","Progress","Feedback","Lain-lain"];
const ASTAT=["Belum","Dalam proses","Selesai"];

let S={people:[],meetings:[]};
let cur="takungan", q="", view="penjejak", openExp=true;

const store={
  async get(k){ try{ if(window.storage&&window.storage.get){ return await window.storage.get(k);} }catch(e){}
    try{ const v=localStorage.getItem(k); return v!=null?{value:v}:null; }catch(e){ return null; } },
  async set(k,v){ try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return;} }catch(e){}
    try{ localStorage.setItem(k,v);}catch(e){} }
};
async function load(){ try{ const r=await store.get(KEY); if(r&&r.value) S=JSON.parse(r.value);}catch(e){} if(!S.people)S.people=[]; if(!S.meetings)S.meetings=[]; }
let saveT; function save(){ clearTimeout(saveT); saveT=setTimeout(async()=>{ try{ await store.set(KEY,JSON.stringify(S)); }catch(e){} },150); }

const $=s=>document.querySelector(s);
function el(t,c){const e=document.createElement(t); if(c)e.className=c; return e;}
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600);}
function initials(n){ n=(n||"").trim(); if(!n)return "?"; return n.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function today(){ return new Date().toISOString().slice(0,10); }
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function newPerson(stage){ return {id:uid("p_"),nama:"",kursus:"",telefon:"",pd:"",stage,status:"",keahlian:"",
  tarikhMula:"",mutAtt:Array(8).fill(false),mutS2:"Belum",mutS3:"Belum",
  tarikhMuhib:"",muhAtt:Array(7).fill(false),muhS2:"Belum",muhS3:"Belum",muhS4:"Belum",
  tarikhMuayyid:"",catatan:"",_open:true}; }
function newMeeting(){ return {id:uid("m_"),tarikh:today(),jenis:"LMM",minit:"",items:[],_open:true}; }
function newItem(){ return {id:uid("a_"),tugasan:"",pic:"",due:"",status:"Belum"}; }
function get(id){ return S.people.find(p=>p.id===id); }
function getMeet(id){ return S.meetings.find(m=>m.id===id); }

function mutHadir(p){ return (p.mutAtt||[]).filter(Boolean).length; }
function muhKom(p){ return (p.muhAtt||[]).filter(Boolean).length; }
function statusOf(p){
  if(p.stage==="mutabaah"){ const h=mutHadir(p);
    if(h>=3&&p.mutS2==="Ada"&&p.mutS3==="Ya") return {k:"g",t:"✅ Layak Tarsyih"};
    if(h>=3) return {k:"a",t:"⏳ Nilai syarat 2 & 3"};
    if(h>0) return {k:"b",t:"Mutabaah aktif"}; return {k:"n",t:"Belum mula"}; }
  if(p.stage==="muhib"){ const k=muhKom(p);
    if(k>=5&&p.muhS2==="Ada"&&p.muhS3==="Ada"&&p.muhS4==="Ya") return {k:"g",t:"✅ Layak Kenaikan MAY"};
    if(k>0) return {k:"b",t:"Kemenjadian aktif"}; return {k:"n",t:"Baru muhib"}; }
  if(p.stage==="takungan"){ if(p.status) return {k:(p.status==="Dah masuk group"?"g":(p.status.indexOf("Tak")===0||p.status.indexOf("Tiada")===0?"a":"b")),t:p.status}; return {k:"n",t:"Belum dihubungi"}; }
  return {k:"g",t:"✓ Muayyid"};
}
function eligible(p){
  if(p.stage==="mutabaah"||p.stage==="muhib") return statusOf(p).t.includes("Layak");
  if(p.stage==="takungan") return p.status==="Dah masuk group";
  return false;
}

/* ---------- penjejak render ---------- */
function renderPipe(){ const pipe=$("#pipe"); pipe.innerHTML="";
  STAGES.forEach(st=>{ const n=S.people.filter(p=>p.stage===st.id).length;
    const b=el("button","pstep"+(cur===st.id?" active":"")); b.innerHTML=`${st.label}<span class="c">${n}</span>`;
    b.onclick=()=>{ cur=st.id; render(); }; pipe.appendChild(b); }); }
function fld(l,i){ return `<div class="fld"><label>${l}</label>${i}</div>`; }
function sel(id,f,v,opts,ph){ const o=[`<option value="">${ph||"— pilih —"}</option>`].concat(opts.map(x=>`<option${x===v?" selected":""}>${x}</option>`)).join(""); return `<select data-id="${id}" data-f="${f}">${o}</select>`; }
function inp(id,f,v,t,ph){ return `<input data-id="${id}" data-f="${f}" type="${t||"text"}" value="${esc(v)}" placeholder="${ph||""}">`; }
function attGrid(id,arr,labels,f){ return `<div class="att">`+labels.map((l,i)=>`<button class="chip${arr[i]?" on":""}" data-att="${id}|${f}|${i}"><small>${l.split("·")[0]}</small>${l.indexOf("·")>-1?l.split("·")[1]:"H"}</button>`).join("")+`</div>`; }
function bodyFor(p){
  const common=fld("Nama penuh",inp(p.id,"nama",p.nama,"text","Nama mad'u"))
    +`<div class="two">${fld("Kursus",inp(p.id,"kursus",p.kursus,"text","cth. Undang-Undang"))}${fld("No. telefon",inp(p.id,"telefon",p.telefon,"tel","01x-xxxxxxx"))}</div>`
    +fld("Nama PD / Mas'ul",inp(p.id,"pd",p.pd,"text","Penggerak Dakwah"));
  let mid="";
  if(p.stage==="takungan") mid=`<div class="two">${fld("Status contact",sel(p.id,"status",p.status,CONTACT))}${fld("Keahlian",sel(p.id,"keahlian",p.keahlian,["AHLI","BUKAN AHLI"]))}</div>`;
  if(p.stage==="mutabaah") mid=fld("Tarikh mula mutabaah",inp(p.id,"tarikhMula",p.tarikhMula,"date"))
    +fld("Kehadiran usrah (tap = hadir)",attGrid(p.id,p.mutAtt,MUT_SESS,"mutAtt"))
    +`<div class="hadir-line">Hadir: <b>${mutHadir(p)}</b> / 8 &nbsp;·&nbsp; syarat 1 (≥3): <b>${mutHadir(p)>=3?"✔":"belum"}</b></div>`
    +`<div class="two" style="margin-top:12px">${fld("Syarat 2 · Keinginan berubah",sel(p.id,"mutS2",p.mutS2,["Belum","Ada"],"Belum"))}${fld("Syarat 3 · Minat usrah",sel(p.id,"mutS3",p.mutS3,["Belum","Ya"],"Belum"))}</div>`;
  if(p.stage==="muhib") mid=fld("Tarikh jadi muhib",inp(p.id,"tarikhMuhib",p.tarikhMuhib,"date"))
    +fld("Komitmen bulanan (tap = hadir)",attGrid(p.id,p.muhAtt,MUH_MTH,"muhAtt"))
    +`<div class="hadir-line">Bulan komited: <b>${muhKom(p)}</b> / 7 &nbsp;·&nbsp; syarat 1 (≥5): <b>${muhKom(p)>=5?"✔":"belum"}</b></div>`
    +`<div class="two" style="margin-top:12px">${fld("Syarat 2 · Kerja berpasukan",sel(p.id,"muhS2",p.muhS2,["Belum","Ada"],"Belum"))}${fld("Syarat 3 · Ciri kesolehan",sel(p.id,"muhS3",p.muhS3,["Belum","Ada"],"Belum"))}</div>`
    +fld("Syarat 4 · Minat tarbiah khusus",sel(p.id,"muhS4",p.muhS4,["Belum","Ya"],"Belum"));
  if(p.stage==="muayyid") mid=fld("Tarikh kenaikan MAY",inp(p.id,"tarikhMuayyid",p.tarikhMuayyid,"date"));
  const cat=fld("Catatan",`<textarea data-id="${p.id}" data-f="catatan" placeholder="Nota…">${esc(p.catatan)}</textarea>`);
  let lab="",show=true;
  if(p.stage==="takungan")lab="Mula Mutabaah →"; else if(p.stage==="mutabaah")lab="Naik ke Muhib →";
  else if(p.stage==="muhib")lab="Naik ke Muayyid →"; else show=false;
  const act=`<div class="actions">`+(show?`<button class="promote${eligible(p)?" ready":""}" data-promote="${p.id}">${lab}</button>`:``)+`<button class="del" data-del="${p.id}">Buang</button></div>`;
  return common+mid+cat+act;
}
function card(p){ const st=statusOf(p); const meta=[p.kursus,p.pd].filter(Boolean).join(" · ")||"tiada butiran lagi";
  const c=el("div","pcard"+(p._open?" open":""));
  c.innerHTML=`<div class="phead" data-tog="${p.id}"><div class="pav">${initials(p.nama)}</div>
    <div class="pmid"><div class="pname${p.nama?"":" empty"}">${p.nama?esc(p.nama):"(nama baharu)"}</div><div class="pmeta">${esc(meta)}</div></div>
    <span class="badge b-${st.k}">${st.t}</span><span class="chev">▼</span></div>
    <div class="pbody">${bodyFor(p)}</div>`;
  return c; }
function stageSummary(){ const ppl=S.people.filter(p=>p.stage===cur); const s=$("#summary");
  if(cur==="mutabaah"){ const n=ppl.filter(p=>statusOf(p).t.includes("Layak")).length; s.innerHTML=`<b>${ppl.length}</b> mutabaah &nbsp;·&nbsp; <span class="hi">${n} layak tarsyih</span>`; }
  else if(cur==="muhib"){ const n=ppl.filter(p=>statusOf(p).t.includes("Layak")).length; s.innerHTML=`<b>${ppl.length}</b> muhib &nbsp;·&nbsp; <span class="hi">${n} layak kenaikan MAY</span>`; }
  else if(cur==="takungan"){ const n=ppl.filter(p=>p.status==="Dah masuk group").length; s.innerHTML=`<b>${ppl.length}</b> dalam takungan &nbsp;·&nbsp; <span class="hi">${n} dah masuk group</span>`; }
  else s.innerHTML=`<b>${ppl.length}</b> muayyid`; }
function renderPenjejak(){ renderPipe(); stageSummary(); const list=$("#list"); const y=window.scrollY; list.innerHTML="";
  let ppl=S.people.filter(p=>p.stage===cur); if(q) ppl=ppl.filter(p=>(p.nama||"").toLowerCase().includes(q));
  if(ppl.length===0){ list.innerHTML=`<div class="empty-state"><div class="big">📋</div><b>${q?"Tiada padanan":"Belum ada nama di sini"}</b><br>${q?"":"Tekan ＋ Tambah untuk mula."}</div>`; return; }
  ppl.forEach(p=>list.appendChild(card(p))); window.scrollTo(0,y); }

/* ---------- minit render ---------- */
function inpA(mid,iid,f,v,ph){ return `<input data-mid="${mid}" data-iid="${iid}" data-f="${f}" value="${esc(v)}" placeholder="${ph||""}">`; }
function aitemHTML(mid,it){ const done=it.status==="Selesai";
  return `<div class="aitem${done?" done":""}">${inpA(mid,it.id,"tugasan",it.tugasan,"Tugasan…")}
    <div class="two">${inpA(mid,it.id,"pic",it.pic,"PIC / owner")}<input data-mid="${mid}" data-iid="${it.id}" data-f="due" type="date" value="${esc(it.due)}"></div>
    <div class="arow"><select data-mid="${mid}" data-iid="${it.id}" data-f="status">${ASTAT.map(s=>`<option${s===it.status?" selected":""}>${s}</option>`).join("")}</select>
    <button class="delmini" data-delitem="${mid}|${it.id}">✕</button></div></div>`; }
function meetCard(m){ const openN=m.items.filter(it=>it.status!=="Selesai").length;
  const c=el("div","pcard"+(m._open?" open":""));
  c.innerHTML=`<div class="phead" data-meettog="${m.id}"><div class="pav">📅</div>
    <div class="pmid"><div class="pname">${esc(m.jenis)} · ${esc(m.tarikh||"—")}</div><div class="pmeta">${m.items.length} tindakan${openN?` · ${openN} terbuka`:``}</div></div>
    <span class="badge ${openN?"b-a":"b-g"}">${openN?openN+" terbuka":"selesai"}</span><span class="chev">▼</span></div>
    <div class="pbody">
      <div class="two">${fld("Tarikh",`<input data-meet="${m.id}" data-f="tarikh" type="date" value="${esc(m.tarikh)}">`)}${fld("Jenis",`<select data-meet="${m.id}" data-f="jenis">${MEET_TYPES.map(t=>`<option${t===m.jenis?" selected":""}>${t}</option>`).join("")}</select>`)}</div>
      ${fld("Minit / nota",`<textarea data-meet="${m.id}" data-f="minit" placeholder="Perkara dibincang, keputusan…" style="min-height:96px">${esc(m.minit)}</textarea>`)}
      <div class="ahead">Tindakan (${m.items.length})</div>
      <div>${m.items.map(it=>aitemHTML(m.id,it)).join("")}</div>
      <button class="addsub" data-additem="${m.id}">＋ Tindakan</button>
      <div class="actions"><button class="del" data-delmeet="${m.id}" style="flex:1">Buang mesyuarat</button></div>
    </div>`;
  return c; }
function renderMinit(){
  const open=[]; S.meetings.forEach(m=>m.items.forEach(it=>{ if(it.status!=="Selesai") open.push({m,it}); }));
  $("#openItems").innerHTML=`<div class="openbox"><div class="openhead" id="openTog">Tindakan Terbuka <span class="ocount">${open.length}</span><span class="cv">${openExp?"sembunyi ▲":"papar ▼"}</span></div>
    <div class="openlist${openExp?" show":""}">${open.length?open.map(({m,it})=>`<div class="orow"><div class="ol"><b>${esc(it.tugasan||"(tugasan)")}</b><div class="osub">${[it.pic,it.due,(m.jenis+" "+m.tarikh)].filter(Boolean).join(" · ")}</div></div><button class="odone" data-done="${m.id}|${it.id}" title="Tandakan selesai">✓</button></div>`).join(""):`<div class="oempty">Tiada tindakan terbuka 🎉</div>`}</div></div>`;
  const list=$("#meetList"); const y=window.scrollY; list.innerHTML="";
  if(S.meetings.length===0){ list.innerHTML=`<div class="empty-state"><div class="big">📝</div><b>Belum ada mesyuarat</b><br>Tekan ＋ Mesyuarat baharu untuk mula.</div>`; return; }
  S.meetings.forEach(m=>list.appendChild(meetCard(m))); window.scrollTo(0,y);
}
function render(){ if(view==="penjejak") renderPenjejak(); else renderMinit(); }

function setView(v){ view=v; document.querySelectorAll("#viewseg button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
  $("#view-penjejak").style.display=v==="penjejak"?"block":"none"; $("#view-minit").style.display=v==="minit"?"block":"none"; render(); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const seg=e.target.closest("#viewseg button"); if(seg){ setView(seg.dataset.v); return; }
  const tog=e.target.closest("[data-tog]"); if(tog){ const p=get(tog.dataset.tog); if(p){p._open=!p._open; render();} return; }
  const att=e.target.closest("[data-att]"); if(att){ const [id,f,i]=att.dataset.att.split("|"); const p=get(id); if(p){p[f][+i]=!p[f][+i]; save(); render();} return; }
  const pr=e.target.closest("[data-promote]"); if(pr){ promote(get(pr.dataset.promote)); return; }
  const del=e.target.closest("[data-del]"); if(del){ const p=get(del.dataset.del); if(p&&confirm(`Buang "${p.nama||"nama baharu"}"?`)){ S.people=S.people.filter(x=>x.id!==p.id); save(); render(); toast("Dibuang"); } return; }
  const mt=e.target.closest("[data-meettog]"); if(mt){ const m=getMeet(mt.dataset.meettog); if(m){m._open=!m._open; render();} return; }
  const ai=e.target.closest("[data-additem]"); if(ai){ const m=getMeet(ai.dataset.additem); if(m){ m.items.push(newItem()); save(); render(); } return; }
  const di=e.target.closest("[data-delitem]"); if(di){ const [mid,iid]=di.dataset.delitem.split("|"); const m=getMeet(mid); if(m){ m.items=m.items.filter(x=>x.id!==iid); save(); render(); } return; }
  const dm=e.target.closest("[data-delmeet]"); if(dm){ const m=getMeet(dm.dataset.delmeet); if(m&&confirm("Buang mesyuarat ini?")){ S.meetings=S.meetings.filter(x=>x.id!==m.id); save(); render(); toast("Mesyuarat dibuang"); } return; }
  const dn=e.target.closest("[data-done]"); if(dn){ const [mid,iid]=dn.dataset.done.split("|"); const m=getMeet(mid); const it=m&&m.items.find(x=>x.id===iid); if(it){ it.status="Selesai"; save(); render(); toast("Ditandakan selesai"); } return; }
  if(e.target.closest("#openTog")){ openExp=!openExp; render(); return; }
  if(!e.target.closest(".menu")) $("#menuPop").classList.remove("show");
});
document.addEventListener("input",e=>{ const t=e.target,d=t.dataset||{}; if(!(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  if(d.id&&d.f){ const p=get(d.id); if(p){p[d.f]=t.value; save();} return; }
  if(d.meet&&d.f){ const m=getMeet(d.meet); if(m){m[d.f]=t.value; save();} return; }
  if(d.mid&&d.iid&&d.f){ const m=getMeet(d.mid); const it=m&&m.items.find(x=>x.id===d.iid); if(it){it[d.f]=t.value; save();} return; }
});
document.addEventListener("change",e=>{ const t=e.target,d=t.dataset||{};
  if(d.id&&d.f&&t.tagName==="SELECT"){ const p=get(d.id); if(p){p[d.f]=t.value; save(); render();} return; }
  if(d.meet&&d.f){ const m=getMeet(d.meet); if(m){m[d.f]=t.value; save(); render();} return; }
  if(d.mid&&d.iid&&d.f){ const m=getMeet(d.mid); const it=m&&m.items.find(x=>x.id===d.iid); if(it){it[d.f]=t.value; save(); render();} return; }
});
$("#addBtn").addEventListener("click",()=>{ const p=newPerson(cur); S.people.unshift(p); q=""; $("#search").value=""; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); });
$("#addMeetBtn").addEventListener("click",()=>{ S.meetings.unshift(newMeeting()); save(); render(); window.scrollTo({top:0,behavior:"smooth"}); });
$("#search").addEventListener("input",e=>{ q=e.target.value.trim().toLowerCase(); render(); });
$("#menuBtn").addEventListener("click",e=>{ e.stopPropagation(); $("#menuPop").classList.toggle("show"); });
$("#menuPop").addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b)return; const a=b.dataset.act; $("#menuPop").classList.remove("show");
  if(a==="gagasan") window.location.href="gagasan.html";
  if(a==="json") exportJSON(); if(a==="csv") exportCSV(); if(a==="acsv") exportActionsCSV();
  if(a==="import") $("#fileImport").click();
  if(a==="reset"){ if(confirm("Set semula SEMUA data (ahli + mesyuarat)? Simpan JSON dahulu jika perlu.")){ S={people:[],meetings:[]}; save(); render(); toast("Data diset semula"); } }
});
$("#fileImport").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); S=d.people?d:{people:d,meetings:[]}; if(!S.people)S.people=[]; if(!S.meetings)S.meetings=[]; save(); render(); toast("Data dimuat masuk"); }catch(err){ toast("Fail tidak sah"); } };
  r.readAsText(f); e.target.value=""; });

function promote(p){ if(!p)return;
  if(!eligible(p)){ const msg=p.stage==="takungan"?"Status belum \u201cDah masuk group\u201d.":"Belum layak tarsyih/kenaikan."; if(!confirm(msg+" Teruskan naik taraf juga?")) return; }
  if(p.stage==="takungan"){ p.stage="mutabaah"; if(!p.tarikhMula)p.tarikhMula=today(); }
  else if(p.stage==="mutabaah"){ p.stage="muhib"; if(!p.tarikhMuhib)p.tarikhMuhib=today(); }
  else if(p.stage==="muhib"){ p.stage="muayyid"; if(!p.tarikhMuayyid)p.tarikhMuayyid=today(); }
  p._open=false; save(); cur=p.stage; render(); toast("Naik taraf ke "+p.stage.charAt(0).toUpperCase()+p.stage.slice(1)); }

function dl(name,text,type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
function cc(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportJSON(){ dl(`Penjejak-PSM-${today()}.json`,JSON.stringify(S,null,2),"application/json"); toast("JSON dimuat turun"); }
function exportCSV(){ const head=["Peringkat","Nama","Kursus","Telefon","PD","Status contact","Keahlian","Tarikh mula","Mut hadir","Mut status","Tarikh muhib","Bulan komited","Muhib status","Tarikh muayyid","Catatan"];
  const rows=S.people.map(p=>{ const ms=p.stage==="mutabaah"?statusOf(p).t:""; const hs=p.stage==="muhib"?statusOf(p).t:"";
    return [p.stage,p.nama,p.kursus,p.telefon,p.pd,p.status,p.keahlian,p.tarikhMula,mutHadir(p),ms,p.tarikhMuhib,muhKom(p),hs,p.tarikhMuayyid,p.catatan].map(cc).join(","); });
  dl(`Penjejak-PSM-${today()}.csv`,"\ufeff"+[head.join(","),...rows].join("\n"),"text/csv"); toast("CSV ahli dimuat turun"); }
function exportActionsCSV(){ const head=["Tarikh Mesyuarat","Jenis","Tugasan","PIC","Tarikh Akhir","Status"]; const rows=[];
  S.meetings.forEach(m=>m.items.forEach(it=>rows.push([m.tarikh,m.jenis,it.tugasan,it.pic,it.due,it.status].map(cc).join(","))));
  dl(`Tindakan-PSM-${today()}.csv`,"\ufeff"+[head.join(","),...rows].join("\n"),"text/csv"); toast("CSV tindakan dimuat turun"); }

(async function(){ await load(); render(); })();
</script>
</body>
</html>
