<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3b8c">
<title>Kit PD · PEMBINA Shah Alam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--blue:#0a3b8c;--blue-ink:#072a63;--blue-2:#1657c4;--yellow:#ffce33;--ink:#0e1726;--muted:#5b6b86;
    --line:#e3e9f4;--paper:#eef2fa;--card:#fff;--green:#1f9d55;--green-s:#e4f6ec;--amber:#dd9021;--amber-s:#fcf1dc;
    --blueb:#3f74d6;--blue-s:#e4ecfb;--grey-s:#eef1f7;--red:#d3453f;--red-s:#fbe6e5;--purple:#6b3fa0;
    --shadow:0 1px 2px rgba(9,30,66,.06),0 6px 18px rgba(9,30,66,.07);
    --font:ui-sans-serif,system-ui,"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.4;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit;font-size:15px}
  h1,h2,h3{margin:0}

  header{position:sticky;top:0;z-index:30;width:100%;background:linear-gradient(120deg,var(--blue-ink),var(--blue) 58%,var(--blue-2));color:#fff;padding:calc(11px + env(safe-area-inset-top)) 0 11px}
  .hin{max-width:1160px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
  .logo{background:#fff;border-radius:11px;padding:6px;flex:0 0 auto;box-shadow:0 2px 8px rgba(7,42,99,.2);display:grid;place-items:center}
  .logo img{height:36px;width:auto;display:block}
  .htxt{flex:1;min-width:0}.htxt .e{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#bcd0f5;font-weight:700}
  .htxt h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
  .hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;height:38px;min-width:38px;padding:0 11px;border-radius:10px;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;font-weight:700}
  .menu{position:relative}
  .menu-pop{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:none;z-index:40}
  .menu-pop.show{display:block}
  .menu-pop button{display:flex;width:100%;text-align:left;gap:9px;align-items:center;background:none;border:none;padding:11px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)}
  .menu-pop button:hover{background:var(--paper)}.menu-pop hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
  .menu-pop button.danger{color:var(--red)}

  .topnav{position:sticky;top:60px;z-index:25;width:100%;background:#fff;border-bottom:1px solid var(--line)}
  .navin{max-width:1160px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
  .navin::-webkit-scrollbar{display:none}
  .navtab{flex:0 0 auto;border:none;background:none;padding:14px 15px;font-weight:800;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
  .navtab.active{color:var(--blue);border-bottom-color:var(--yellow)}

  .app{max-width:1160px;margin:0 auto;padding:14px 16px 100px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .pill{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:22px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  .pill .c{background:var(--paper);border-radius:10px;padding:1px 7px;font-size:12px;font-weight:800}
  .pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}.pill.active .c{background:var(--yellow);color:var(--blue-ink)}
  .search{position:relative;flex:1;min-width:180px}
  .search input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px 10px 34px;background:#fff;box-shadow:var(--shadow)}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .add{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
  .add:active{background:var(--blue-2)}
  .btn2{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .filters select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:13px;color:var(--ink)}
  .fx{font-size:12px;color:var(--muted);align-self:center}

  .rows{display:flex;flex-direction:column;gap:8px}
  .row{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
  .rhead{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .rav{width:34px;height:34px;border-radius:9px;background:var(--paper);display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:13px;flex:0 0 auto}
  .rname{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rname.empty{color:var(--muted);font-style:italic;font-weight:600}
  .rtags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;background:var(--blue-s);color:var(--blueb)}
  .tag.pd{background:#efe8f8;color:var(--purple)}
  .tag.st{background:var(--grey-s);color:var(--muted)}
  .tag.ses{background:var(--paper);color:var(--ink)}
  .badge{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap}
  .b-g{background:var(--green-s);color:var(--green)}.b-a{background:var(--amber-s);color:var(--amber)}.b-b{background:var(--blue-s);color:var(--blueb)}.b-n{background:var(--grey-s);color:var(--muted)}.b-r{background:var(--red-s);color:var(--red)}
  .chev{color:var(--muted);width:24px;text-align:center;flex:0 0 auto}
  .rbody{display:none;border-top:1px solid var(--line);padding:14px;background:#fcfdff}
  .row.open .rbody{display:block}.row.open .chev{transform:rotate(180deg)}
  .row.inactive{opacity:.6}

  .grp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .grp>h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:10px;font-weight:800}
  .etabs{display:flex;gap:6px;margin-bottom:12px}
  .etab{flex:1;border:1px solid var(--line);background:#fff;color:var(--muted);padding:10px;border-radius:10px;font-weight:800;font-size:13px}
  .etab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .fld{margin-bottom:11px}.fld:last-child{margin-bottom:0}
  .fld label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink)}
  .fld textarea{resize:vertical;min-height:44px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:640px){.g3{grid-template-columns:1fr 1fr}}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .toggle button{border:none;background:#fff;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted)}
  .toggle button.on{background:var(--blue);color:#fff}
  .toggle.g button.on{background:var(--green)} .toggle.r button.on{background:var(--red)}
  .actions{display:flex;gap:9px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .promote{flex:1;border:none;border-radius:11px;padding:12px;font-weight:800;font-size:14px;background:var(--paper);color:var(--blue)}
  .promote.ready{background:var(--yellow);color:var(--blue-ink)}
  .del{border:1px solid var(--red-s);background:#fff;color:var(--red);border-radius:11px;padding:12px 15px;font-weight:700;font-size:14px}
  .addsub{width:100%;border:1px dashed var(--line);background:var(--paper);color:var(--blue);border-radius:10px;padding:10px;font-weight:800;font-size:13px;margin-top:4px}
  .subrow{border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff}
  .att{display:flex;flex-wrap:wrap;gap:7px}
  .nchip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-weight:700;font-size:12.5px;color:var(--muted)}
  .nchip.on{background:var(--green);border-color:var(--green);color:#fff}
  .nchip.add{border-style:dashed;color:var(--blue)}
  .delmini{border:1px solid var(--red-s);background:#fff;color:var(--red);border-radius:8px;min-width:40px;padding:0 8px;font-weight:700;flex:0 0 auto}
  .rowflex{display:flex;gap:8px;align-items:center}

  /* bpmy */
  .bcat{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
  .bcat h4{margin:0;padding:10px 12px;font-size:13.5px;font-weight:800;background:var(--paper);display:flex;justify-content:space-between;align-items:center}
  .bcat h4 .cp{font-size:12px;color:var(--muted);font-weight:700}
  .bitem{padding:9px 12px;border-top:1px solid var(--line)}
  .bitem .bt{font-size:12.5px;margin-bottom:6px}.bitem .bt .w{color:var(--muted);font-weight:700}
  .bitem .wajib{color:var(--red);font-weight:800;font-size:10px}
  .scale{display:flex;gap:5px}
  .scb{width:34px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:800;color:var(--muted);font-size:13px}
  .scb.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
  .bsum{background:var(--blue);color:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
  .bsum .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .bsum table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
  .bsum td{padding:3px 0;color:#dbe6ff}.bsum td:last-child{text-align:right;font-weight:700;color:#fff}
  .passpill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:#fff}
  .passpill.ok{color:var(--green)}.passpill.no{color:var(--red)}

  /* calendar */
  .caltop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .caltop h3{font-size:16px;font-weight:800}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cald,.calh{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:66px;padding:5px}
  .calh{min-height:auto;text-align:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--paper)}
  .cald .dn{font-size:11px;color:var(--muted);font-weight:700}
  .cald.out{background:var(--paper);opacity:.5}
  .cev{font-size:10px;font-weight:700;background:var(--blue-s);color:var(--blueb);border-radius:5px;padding:2px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .cev.done{background:var(--green-s);color:var(--green)}.cev.tangguh{background:var(--amber-s);color:var(--amber)}

  .empty{text-align:center;color:var(--muted);padding:44px 16px}.empty .big{font-size:32px;margin-bottom:8px}.empty b{color:var(--ink)}
  .stats{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .stats h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--paper)}
  .stat-row b{color:var(--blue)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:60;box-shadow:var(--shadow);max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=file]{display:none}
  .cev.hol-umum{background:var(--red-s);color:var(--red)} .cev.hol-sem{background:#efe8f8;color:var(--purple)}
  .cev.hol-study{background:var(--amber-s);color:var(--amber)} .cev.hol-lain{background:var(--grey-s);color:var(--muted)}
  .gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--blue-ink),var(--blue));display:none;align-items:center;justify-content:center;padding:20px}
  .gatebox{background:#fff;border-radius:18px;padding:26px 24px;max-width:380px;width:100%;box-shadow:var(--shadow)}
  .gatelogo{display:grid;place-items:center;margin-bottom:12px}.gatelogo img{height:54px}
  .gatebox h2{font-size:20px;font-weight:800;text-align:center}
  .gsub{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0 16px}
  .gatebox label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
  .gatebox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px}
  .gbtn{width:100%;margin-top:14px;background:var(--blue);color:#fff;border:none;border-radius:11px;padding:12px;font-weight:800}
  .gbtn2{width:100%;margin-top:8px;background:var(--paper);color:var(--blue);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700}
  .glink{display:block;width:100%;margin-top:12px;background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer}
  .gerr{color:var(--red);font-size:12.5px;margin-top:8px;text-align:center;min-height:14px}
  .gset{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.gset summary{font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .hint{font-size:11.5px;color:var(--muted);background:var(--paper);border-radius:9px;padding:9px 11px;margin-bottom:10px}
</style>
</head>

function titleCase(v){return(v||"").replace(/(^|[\s\-\/])([a-zà-ÿ])/g,(m,p,c)=>p+c.toUpperCase());}
function fmtPhone(v){const d=(v||"").replace(/\D/g,"").slice(0,11);if(!d)return"";const a=d.slice(0,3),b=d.slice(3,6),c=d.slice(6);return a+(b?"-"+b:"")+(c?" "+c:"");}
function normVal(f,v){if(f==="telefon")return fmtPhone(v);if(f==="email")return(v||"").trim().toLowerCase();if(f==="poskod")return(v||"").replace(/\D/g,"").slice(0,5);if(TITLE_FIELDS.has(f))return titleCase(v);return v;}

/* ---- MUT status ---- */
function sesCount(p){return(p.sessions||[]).length;}
function mutStatus(p){const n=sesCount(p);if(n>=3&&p.minatUsrah==="Ya")return{k:"g",t:"Layak Tarsyih"};if(n>=3)return{k:"a",t:"Tunggu minat usrah"};if(n>0)return{k:"b",t:"Mutabaah aktif"};return{k:"n",t:"Belum mula"};}
/* ---- BPMy ---- */
function bpmy(p){const sc=p.bpmy||{};let total=0;const cats=BPMY.map(c=>{let s=0,max=0;c.items.forEach(it=>{s+=(sc[it.id]||0)*it.w;max+=5*it.w;});total+=s;return{id:c.id,name:c.name,score:s,max:max};});
  return{cats,total,pct:total/BPMY_MAX,pass:(total/BPMY_MAX)>=0.5};}
function muhStatus(p){const b=bpmy(p);const pc=Math.round(b.pct*100);if(b.pass)return{k:"g",t:"Layak MAY · "+pc+"%"};if(b.total>0)return{k:"b",t:"BPMy "+pc+"%"};return{k:"n",t:"Baru muhib"};}
function statusOf(p){if(p.stage==="mutabaah")return mutStatus(p);if(p.stage==="muhib")return muhStatus(p);if(p.stage==="muayyid")return{k:"g",t:"Muayyid"};return{k:"n",t:"Baru"};}
function eligible(p){if(p.stage==="mutabaah")return sesCount(p)>=3&&p.minatUsrah==="Ya";if(p.stage==="muhib")return bpmy(p).pass;return false;}
function stageLabel(s){return(STAGES.find(x=>x.id===s)||{}).label||s;}

/* =============== RENDER =============== */
function setView(v){view=v;document.querySelectorAll(".navtab").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render();}
function render(){const a=$("#app");
  if(view==="keahlian")a.innerHTML=viewKeahlian();
  else if(view==="minit")a.innerHTML=viewMinit();
  else if(view==="wasilah")a.innerHTML=viewWasilah();
  else if(view==="tuntutan")a.innerHTML=viewTuntutan();
}

/* helpers for fields */
function T(id,f,v,ph,type){return `<input data-ed="${id}" data-f="${f}" type="${type||"text"}" value="${esc(v)}" placeholder="${ph||""}">`;}
function TA(id,f,v,ph){return `<textarea data-ed="${id}" data-f="${f}" placeholder="${ph||""}">${esc(v)}</textarea>`;}
function SELf(id,f,v,opts){return `<select data-ed="${id}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function fld(l,inner){return `<div class="fld"><label>${l}</label>${inner}</div>`;}
function attList(kind,id,arr){arr=arr||[];return `<div class="grp"><h3>Lampiran (fail di Drive)</h3>${arr.length?arr.map((a,i)=>`<div class="subrow rowflex"><a href="${esc(a.url)}" target="_blank" rel="noopener" style="flex:1;color:var(--blue-2);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name||"fail")}</a><button class="delmini" data-rmatt="${kind}|${id}|${i}">✕</button></div>`).join(""):`<div class="hint">Tiada lampiran lagi.</div>`}<button class="addsub" data-uplbtn="${kind}|${id}">＋ Muat naik fail</button>${SYNC.ok?"":`<div class="hint">Log masuk & sync dahulu untuk muat naik ke Drive.</div>`}</div>`;}
function selManaged(id,f,v,list){const opts=S[list]||[];const cur=(v&&!opts.includes(v))?`<option selected>${esc(v)}</option>`:"";return `<select data-ed="${id}" data-f="${f}" data-list="${list}"><option value="">— pilih —</option>${cur}${opts.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}<option value="__add__">＋ Tambah baharu…</option></select>`;}
function stageSelect(id,v){return `<select data-ed="${id}" data-f="stage">`+STAGES.map(s=>`<option value="${s.id}"${s.id===v?" selected":""}>${s.label}</option>`).join("")+`</select>`;}

/* ---------- KEAHLIAN ---------- */
function pdOptions(){const set=new Set(S.pds||[]);S.people.forEach(p=>{if(p.pd1)set.add(p.pd1);if(p.pd2)set.add(p.pd2);});return[...set].sort();}
function iptOptions(){const set=new Set(S.universities||[]);S.people.forEach(p=>{if(p.universiti)set.add(p.universiti);});return[...set].sort();}
function filteredPeople(){let list=S.people.slice();
  if(stage!=="all")list=list.filter(p=>p.stage===stage);
  if(q)list=list.filter(p=>(p.nama||"").toLowerCase().includes(q));
  if(F.pd)list=list.filter(p=>p.pd1===F.pd||p.pd2===F.pd);
  if(F.minat)list=list.filter(p=>(p.minatUsrah||"Belum")===F.minat);
  if(F.ajk)list=list.filter(p=>(p.minatAJK||"Tidak")===F.ajk);
  if(F.active&&stage==="all")list=list.filter(p=>(F.active==="Aktif")?p.active!==false:p.active===false);
  if(F.ipt)list=list.filter(p=>(p.universiti||"")===F.ipt);
  if(F.tahun)list=list.filter(p=>(p.tahunPSPB||"")===F.tahun);
  if(F.minSesi){const n=+F.minSesi;list=list.filter(p=>n===3?sesCount(p)>=3:sesCount(p)===n);}
  list.sort((a,b)=>(a.nama||"~").localeCompare(b.nama||"~"));
  return list;}
function viewKeahlian(){
  const pills=[{id:"all",label:"Semua"}].concat(STAGES).map(s=>{const n=(s.id==="all"?S.people:S.people.filter(p=>p.stage===s.id)).length;return `<button class="pill${stage===s.id?" active":""}" data-stage="${s.id}">${s.label}<span class="c">${n}</span></button>`;}).join("");
  const pdOpt=`<option value="">Semua PD</option>`+pdOptions().map(x=>`<option${F.pd===x?" selected":""}>${esc(x)}</option>`).join("");
  const iptOpt=`<option value="">IPT: semua</option>`+iptOptions().map(x=>`<option${F.ipt===x?" selected":""}>${esc(x)}</option>`).join("");
  const filters=`<div class="filters">
    <select data-flt="pd">${pdOpt}</select>
    <select data-flt="ipt">${iptOpt}</select>
    <select data-flt="tahun"><option value="">Tahun PSPB: semua</option>${PSPB_YEARS.map(y=>`<option${F.tahun===y?" selected":""}>${y}</option>`).join("")}</select>
    <select data-flt="minat"><option value="">Minat usrah: semua</option><option${F.minat==="Ya"?" selected":""}>Ya</option><option${F.minat==="Belum"?" selected":""}>Belum</option></select>
    <select data-flt="ajk"><option value="">Minat AJK: semua</option><option${F.ajk==="Ya"?" selected":""}>Ya</option><option value="Tidak"${F.ajk==="Tidak"?" selected":""}>Tidak</option></select>
    <select data-flt="minSesi"><option value="">Sesi: semua</option><option value="1"${F.minSesi==="1"?" selected":""}>1 sesi</option><option value="2"${F.minSesi==="2"?" selected":""}>2 sesi</option><option value="3"${F.minSesi==="3"?" selected":""}>3+ sesi</option></select>
    ${stage==="all"?`<select data-flt="active"><option value="">Status: semua</option><option${F.active==="Aktif"?" selected":""}>Aktif</option><option${F.active==="Tidak aktif"?" selected":""}>Tidak aktif</option></select>`:``}
  </div>`;
  const list=filteredPeople();
  const rows=list.length?list.map(rowKeahlian).join(""):`<div class="empty"><b>Tiada rekod</b><br>Tekan ＋ Tambah atau muat senarai Excel.</div>`;
  return `<div class="bar">${pills}</div>
    <div class="bar"><div class="search"><span class="ic">⌕</span><input id="search" value="${esc(q)}" placeholder="Cari nama…"></div><button class="add" id="addBtn">＋ Tambah</button></div>
    ${filters}${statsPD()}
    <div class="rows">${rows}</div>`;
}
function statsPD(){const map={};
  S.people.forEach(p=>{(p.sessions||[]).forEach(s=>{if(s.jenis!=="Usrah"&&s.jenis!=="DF")return;[s.oleh||p.pd1,s.oleh2].forEach(who=>{if(!who)return;map[who]=map[who]||{Usrah:0,DF:0};map[who][s.jenis]=(map[who][s.jenis]||0)+1;});});});
  const keys=Object.keys(map).sort();if(!keys.length)return "";
  return `<details class="stats" open><summary style="cursor:pointer;font-weight:800;color:var(--blue)">Frekuensi usrah / DF ikut PD</summary><div style="margin-top:8px">`+keys.map(k=>`<div class="stat-row"><span>${esc(k)}</span><b>${map[k].Usrah||0} usrah · ${map[k].DF||0} DF</b></div>`).join("")+`</div></details>`;
}

function rowKeahlian(p){
  const st=statusOf(p);const tags=[];
  if(p.pd1)tags.push(`<span class="tag pd">${esc(p.pd1)}</span>`);if(p.pd2)tags.push(`<span class="tag pd">${esc(p.pd2)}</span>`);
  if(p.stage==="mutabaah")tags.push(`<span class="tag ses">${sesCount(p)} sesi</span>`);
  return `<div class="row${p._open?" open":""}${p.active===false?" inactive":""}">
    <div class="rhead" data-tog="${p.id}"><div class="rav">${initials(p.nama)}</div>
      <div class="rname${p.nama?"":" empty"}">${p.nama?esc(p.nama):"(nama baharu)"}</div>
      <div class="rtags"><span class="tag st">${stageLabel(p.stage)}</span>${tags.join("")}<span class="badge b-${st.k}">${st.t}</span></div>
      <span class="chev">▾</span></div>
    <div class="rbody">${editorKeahlian(p)}</div></div>`;
}

    ${fld("Status ahli",`<div class="toggle g"><button data-tgl="${p.id}|statusAhli|Ya" class="${p.statusAhli==="Ya"?"on":""}">Ya</button><button data-tgl="${p.id}|statusAhli|Belum" class="${p.statusAhli!=="Ya"?"on":""}">Belum</button></div>`)}

function secPD(p){return `<div class="grp"><h3>Penggerak Dakwah & tajmik</h3>

function secCatatan(p){return `<div class="grp"><h3>Catatan</h3>${fld("Nota",TA(p.id,"catatan",p.catatan,"Nota…"))}</div>`+attList("person",p.id,p.lampiran);}
function editorKeahlian(p){
  const info=secMaklumat(p)+secPD(p);
  let tabs=[["Maklumat asas & PD",info],["Kehadiran",mutSection(p)]];
  if(p.stage==="muhib")tabs.push(["Pencalonan Muayyid",muhSection(p)]);
  tabs.push(["Passing",secPassing(p)]); tabs.push(["Catatan",secCatatan(p)]);
  if(p.stage==="muayyid")tabs=[["Maklumat asas & PD",info],["Passing",secPassing(p)],["Catatan",secCatatan(p)]];
  const t=Math.min(p._etab||1,tabs.length);
  const nav=`<div class="etabs">`+tabs.map((tb,i)=>`<button class="etab${(t===i+1)?" on":""}" data-etab="${p.id}|${i+1}">${tb[0]}</button>`).join("")+`</div>`;
  let lab="";if(p.stage==="mutabaah")lab="Naik ke Muhib →";else if(p.stage==="muhib")lab="Naik ke Muayyid →";
  const act=`<div class="actions">${lab?`<button class="promote${eligible(p)?" ready":""}" data-promote="${p.id}">${lab}</button>`:``}<button class="del" data-del="${p.id}">Buang</button></div>`;
  return nav+tabs[t-1][1]+act;
}

function mutSection(p){
  const ses=(p.sessions||[]).map(s=>`<div class="subrow">
     <div class="g2">${fld("Jenis",SELf2(p.id,s.id,"jenis",s.jenis,SES_JENIS))}${fld("Tarikh",Ts(p.id,s.id,"tarikh",s.tarikh,"date"))}</div>
     <div class="g2">${fld("PD 1",SESpd(p.id,s.id,"oleh",s.oleh))}${fld("PD 2",SESpd(p.id,s.id,"oleh2",s.oleh2))}</div>
     <div class="rowflex"><div style="flex:1">${fld("Butiran (pilihan)",Ts(p.id,s.id,"nota",s.nota,"nota"))}</div><button class="delmini" data-delses="${p.id}|${s.id}">✕</button></div>
   </div>`).join("");
  return `<div class="grp"><h3>Kehadiran usrah / DF · ${sesCount(p)} sesi</h3>
    ${ses||`<div class="hint">Belum ada sesi direkod.</div>`}
    <button class="addsub" data-addses="${p.id}">＋ Tambah sesi</button>
    <div class="g2" style="margin-top:11px">
      ${fld("Berminat sertai usrah? (syarat tarsyih)",`<div class="toggle g"><button data-tgl="${p.id}|minatUsrah|Ya" class="${p.minatUsrah==="Ya"?"on":""}">Ya</button><button data-tgl="${p.id}|minatUsrah|Belum" class="${p.minatUsrah!=="Ya"?"on":""}">Belum</button></div>`)}
      ${fld("Berminat jadi AJK?",`<div class="toggle"><button data-tgl="${p.id}|minatAJK|Ya" class="${p.minatAJK==="Ya"?"on":""}">Ya</button><button data-tgl="${p.id}|minatAJK|Tidak" class="${p.minatAJK!=="Ya"?"on":""}">Tidak</button></div>`)}
    </div></div>`;
}

function Ts(pid,sid,f,v,type){return `<input data-ses="${pid}|${sid}" data-f="${f}" type="${type||"text"}" value="${esc(v)}">`;}
function SESpd(pid,sid,f,v){const opts=S.pds||[];const cur=(v&&!opts.includes(v))?`<option selected>${esc(v)}</option>`:"";return `<select data-ses="${pid}|${sid}" data-f="${f}"><option value="">— PD —</option>${cur}${opts.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select>`;}
function SELf2(pid,sid,f,v,opts){return `<select data-ses="${pid}|${sid}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function muhSection(p){
  const b=bpmy(p);
  const sum=`<div class="bsum"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bcd0f5;font-weight:800">Gambaran Fokus Tarbiah MHB</div><div class="big">${Math.round(b.pct*100)}%</div></div><span class="passpill ${b.pass?"ok":"no"}">${b.pass?"LULUS ≥50%":"BELUM 50%"}</span></div>
    <table>${SUMMARY_ORDER.map(cid=>{const c=b.cats.find(x=>x.id===cid);return `<tr><td>${esc(c.name)}</td><td>${Math.round(c.score/BPMY_MAX*100)}% / ${Math.round(c.max/BPMY_MAX*100)}%</td></tr>`;}).join("")}</table></div>`;
  const cats=BPMY.map(c=>{const cs=b.cats.find(x=>x.id===c.id);
    return `<div class="bcat"><h4>${esc(c.name)}<span class="cp">${Math.round(cs.score/BPMY_MAX*100)}% / ${Math.round(cs.max/BPMY_MAX*100)}%</span></h4>
      ${c.items.map(it=>`<div class="bitem"><div class="bt">${esc(it.t)} <span class="w">(×${it.w})</span> ${it.wajib?'<span class="wajib">WAJIB</span>':''}</div>
        <div class="scale">${[0,1,2,3,4,5].map(v=>`<button class="scb ${(p.bpmy&&p.bpmy[it.id]||0)===v?"sel":""}" data-score="${p.id}|${it.id}|${v}">${v}</button>`).join("")}</div></div>`).join("")}
      ${fld("Remarks — "+c.name,TA(p.id,"rmk_"+c.id,(p.remarks||{})[c.id]||"","Catatan ciri ini…"))}
    </div>`;}).join("");
  const extra=`<div class="grp"><h3>Butiran tambahan (kenaikan MAY)</h3>${fld("Program jadi AJK",TA(p.id,"programAJK",p.programAJK,"Senarai program di mana beliau jadi AJK…"))}${fld("Tarikh jadi muhib",T(p.id,"tarikhMuhib",p.tarikhMuhib,"","date"))}</div>`;
  return `<div class="grp"><h3>Borang Pencalonan Muayyid (BPMy)</h3><div class="hint">Skor setiap item 0–5 (× pemberat). Lulus jika jumlah ≥ 50%. <button class="btn2" data-bpmyxl="${p.id}" style="margin-top:6px">⭳ Export BPMy (Excel)</button></div>${sum}${cats}</div>${extra}`;
}

/* ---------- MINIT ---------- */
function viewMinit(){
  const open=[];S.meetings.forEach(m=>m.items.forEach(it=>{if(it.status!=="Selesai")open.push({m,it});}));
  const ob=`<details class="stats" ${openExp?"open":""}><summary style="cursor:pointer;font-weight:800;color:var(--blue)">Tindakan Terbuka (${open.length})</summary><div style="margin-top:8px">`+
    (open.length?open.map(({m,it})=>`<div class="stat-row"><span><b style="color:var(--ink)">${esc(it.tugasan||"(tugasan)")}</b> — ${esc([it.pic,it.due,(m.tajuk||"")].filter(Boolean).join(" · "))}</span><button class="delmini" style="background:var(--green-s);border-color:var(--green);color:var(--green)" data-done="${m.id}|${it.id}" >Tandakan selesai</button></div>`).join(""):`<div class="fx">Tiada tindakan terbuka</div>`)+`</div></details>`;
  const list=S.meetings.length?S.meetings.map(meetCard).join(""):`<div class="empty"><b>Belum ada mesyuarat</b></div>`;
  return `<div class="bar"><button class="add" id="addMeetBtn" style="flex:1">＋ Mesyuarat baharu</button></div>${ob}<div class="rows">${list}</div>`;
}
function rosterNames(){const set=new Set([...(S.pds||[]),...(S.roster||[])]);return [...set].filter(Boolean).sort();}
function rosterChecklist(m){const hadir=m.hadir||[];const names=rosterNames();
  return `<div class="att">`+names.map(n=>`<button class="nchip${hadir.includes(n)?" on":""}" data-hadir="${m.id}|${encodeURIComponent(n)}">${esc(n)}</button>`).join("")+`<button class="nchip add" data-addhadir="${m.id}">＋ Tambah nama</button></div>${names.length?"":`<div class="hint">Belum ada nama. Tekan +Tambah nama; ia disimpan untuk mesyuarat akan datang.</div>`}`;}
function meetCard(m){const openN=m.items.filter(it=>it.status!=="Selesai").length;
  return `<div class="row${m._open?" open":""}"><div class="rhead" data-mtog="${m.id}"><div class="rav">${initials(m.tajuk)||"M"}</div>
    <div class="rname">${esc(m.tajuk||"(tajuk mesyuarat)")}</div>
    <div class="rtags"><span class="tag st">${esc(m.tarikh||"—")}</span><span class="badge ${openN?"b-a":"b-g"}">${openN?openN+" terbuka":"selesai"}</span></div><span class="chev">▾</span></div>
    <div class="rbody">
      <div class="g2">${fld("Tajuk mesyuarat",`<input data-med="${m.id}" data-f="tajuk" value="${esc(m.tajuk)}" placeholder="cth. LMM Ogos / Progress Review">`)}${fld("Tarikh",`<input data-med="${m.id}" data-f="tarikh" type="date" value="${esc(m.tarikh)}">`)}</div>
      ${fld("Kehadiran ("+((m.hadir||[]).length)+")",rosterChecklist(m))}
      ${fld("Agenda",`<textarea data-med="${m.id}" data-f="agenda" placeholder="Agenda mesyuarat…">${esc(m.agenda)}</textarea>`)}
      ${fld("Minit / nota",`<textarea data-med="${m.id}" data-f="minit" placeholder="Perkara dibincang, keputusan…" style="min-height:90px">${esc(m.minit)}</textarea>`)}
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted);margin:12px 0 8px">Tindakan (${m.items.length})</div>
      ${m.items.map(it=>`<div class="subrow"><input data-mit="${m.id}|${it.id}" data-f="tugasan" value="${esc(it.tugasan)}" placeholder="Tugasan…" style="margin-bottom:8px;width:100%;border:1px solid var(--line);border-radius:9px;padding:9px">
        <div class="g2"><input data-mit="${m.id}|${it.id}" data-f="pic" value="${esc(it.pic)}" placeholder="PIC" style="border:1px solid var(--line);border-radius:9px;padding:9px"><input data-mit="${m.id}|${it.id}" data-f="due" type="date" value="${esc(it.due)}" style="border:1px solid var(--line);border-radius:9px;padding:9px"></div>
        <div class="rowflex" style="margin-top:8px"><select data-mit="${m.id}|${it.id}" data-f="status" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:9px">${["Belum","Dalam proses","Selesai"].map(s=>`<option${s===it.status?" selected":""}>${s}</option>`).join("")}</select><button class="delmini" data-delit="${m.id}|${it.id}">✕</button></div></div>`).join("")}
      <button class="addsub" data-addit="${m.id}">＋ Tindakan</button>
      <div class="actions"><button class="del" data-delmeet="${m.id}" style="flex:1">Buang mesyuarat</button></div>
    </div></div>`;
}

/* ---------- WASILAH ---------- */
let wasMode="list";
function viewWasilah(){
  const toggle=`<div class="bar"><div class="toggle"><button class="${wasMode==="list"?"on":""}" data-wmode="list">Senarai</button><button class="${wasMode==="cal"?"on":""}" data-wmode="cal">Kalendar</button></div><button class="add" id="addWasBtn" style="margin-left:auto">＋ Wasilah</button><button class="btn2" id="addHolBtn">＋ Tarikh penting</button></div>`;
  if(wasMode==="cal")return toggle+calLegend()+calendarHTML()+holSection();
  const list=S.wasilah.length?S.wasilah.slice().sort((a,b)=>(a.tarikh||"").localeCompare(b.tarikh||"")).map(wasCard).join(""):`<div class="empty"><b>Belum ada wasilah</b></div>`;
  return toggle+`<div class="rows">${list}</div>`+holSection();
}
function calLegend(){const L=(c,t)=>`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></span>${t}</span>`;return `<div class="hint" style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:8px">${L("var(--blueb)","Wasilah")}${L("var(--red)","Cuti umum")}${L("var(--purple)","Cuti semester")}${L("var(--amber)","Study week")}</div>`;}
function holSection(){const list=(S.holidays||[]).slice().sort((a,b)=>(a.start||"").localeCompare(b.start||""));return `<details class="stats" style="margin-top:12px"><summary style="cursor:pointer;font-weight:800;color:var(--blue)">Tarikh Penting & Cuti (${list.length})</summary><div class="hint" style="margin-top:8px">Cuti umum Selangor (tarikh tetap) telah diisi. Tambah cuti semester UiTM/MSU, study week, atau cuti bergerak (Raya/CNY) di sini — sahkan tarikh rasmi.</div><div class="rows" style="margin-top:8px">${list.map(holCard).join("")}</div></details>`;}
function holCard(h){return `<div class="row${h._open?" open":""}"><div class="rhead" data-htog="${h.id}"><div class="rav" style="background:var(--paper);color:var(--muted)">C</div><div class="rname${h.nama?"":" empty"}">${h.nama?esc(h.nama):"(tarikh penting)"}</div><div class="rtags"><span class="tag">${esc(h.jenis)}</span><span class="tag st">${esc(h.start||"—")}${h.end?" → "+esc(h.end):""}</span></div><span class="chev">▾</span></div><div class="rbody"><div class="g2">${fld("Nama",`<input data-hed="${h.id}" data-f="nama" value="${esc(h.nama)}">`)}${fld("Jenis",`<select data-hed="${h.id}" data-f="jenis">${H_TYPES.map(o=>`<option${o===h.jenis?" selected":""}>${o}</option>`).join("")}</select>`)}</div><div class="g2">${fld("Tarikh mula",`<input data-hed="${h.id}" data-f="start" type="date" value="${esc(h.start)}">`)}${fld("Tarikh tamat (pilihan)",`<input data-hed="${h.id}" data-f="end" type="date" value="${esc(h.end)}">`)}</div><div class="actions"><button class="del" data-delhol="${h.id}" style="flex:1">Buang</button></div></div></div>`;}
function wasCard(w){const sb={"Sudah":"b-g","Belum":"b-n","Tangguh":"b-a"}[w.status]||"b-n";
  return `<div class="row${w._open?" open":""}"><div class="rhead" data-wtog="${w.id}"><div class="rav">${initials(w.nama)||"W"}</div>
    <div class="rname">${esc(w.nama||"(nama program)")}</div>
    <div class="rtags"><span class="tag st">${esc(w.tarikh||"—")}</span><span class="tag">${esc(w.medium)}</span><span class="badge ${sb}">${esc(w.status)}</span></div><span class="chev">▾</span></div>
    <div class="rbody">
      <div class="g2">${fld("Nama program",`<input data-wed="${w.id}" data-f="nama" value="${esc(w.nama)}">`)}${fld("Bahan",`<input data-wed="${w.id}" data-f="bahan" value="${esc(w.bahan)}" placeholder="cth. OBI">`)}</div>
      <div class="g3">${fld("Tarikh",`<input data-wed="${w.id}" data-f="tarikh" type="date" value="${esc(w.tarikh)}">`)}${fld("Medium",SELw(w.id,"medium",w.medium,W_MEDIUM))}${fld("Status pelaksanaan",SELw(w.id,"status",w.status,W_STATUS))}</div>
      <div class="g3">${fld("Target peserta",`<input data-wed="${w.id}" data-f="target" type="number" min="0" value="${esc(w.target)}" placeholder="cth. 30">`)}${fld("Venue",`<input data-wed="${w.id}" data-f="venue" value="${esc(w.venue)}">`)}${fld("Anggaran budget (RM)",`<input data-wed="${w.id}" data-f="budget" type="number" min="0" step="0.01" value="${esc(w.budget)}" placeholder="0.00">`)}</div>
      ${fld("PIC",`<input data-wed="${w.id}" data-f="pic" value="${esc(w.pic)}">`)}
      <div class="g2">${fld("Dapatan — MUH hadir",`<input data-wed="${w.id}" data-f="dapMUH" type="number" min="0" value="${esc(w.dapMUH)}" placeholder="bil.">`)}${fld("Dapatan — MUT hadir",`<input data-wed="${w.id}" data-f="dapMUT" type="number" min="0" value="${esc(w.dapMUT)}" placeholder="bil.">`)}</div>
      ${fld("Catatan / dapatan lain",`<textarea data-wed="${w.id}" data-f="catatan">${esc(w.catatan)}</textarea>`)}
      <div class="actions"><button class="del" data-delwas="${w.id}" style="flex:1">Buang</button></div>
    </div></div>`;
}
function SELw(id,f,v,opts){return `<select data-wed="${id}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}
function holClass(j){return j==="Cuti Umum"?"hol-umum":j==="Cuti Semester"?"hol-sem":j==="Study Week"?"hol-study":"hol-lain";}
function calendarHTML(){
  const y=calDate.getFullYear(),mo=calDate.getMonth();
  const first=new Date(y,mo,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const months=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  const dows=["Isn","Sel","Rab","Kha","Jum","Sab","Ahd"];
  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10);const out=d.getMonth()!==mo;
    const hs=(S.holidays||[]).filter(x=>x.start&&iso>=x.start&&iso<=(x.end||x.start));
    const evs=S.wasilah.filter(w=>w.tarikh===iso);
    cells+=`<div class="cald${out?" out":""}"><div class="dn">${d.getDate()}</div>`+hs.map(x=>`<div class="cev ${holClass(x.jenis)}" title="${esc(x.nama)}">${esc(x.nama||"cuti")}</div>`).join("")+evs.map(w=>`<div class="cev ${w.status==="Sudah"?"done":(w.status==="Tangguh"?"tangguh":"")}" data-wtog="${w.id}" title="${esc(w.nama)}">${esc(w.nama||"program")}</div>`).join("")+`</div>`;}
  return `<div class="caltop"><button class="btn2" data-calnav="-1">‹</button><h3>${months[mo]} ${y}</h3><button class="btn2" data-calnav="1">›</button></div>
    <div class="cal">${dows.map(d=>`<div class="calh">${d}</div>`).join("")}${cells}</div>`;
}

/* ---------- TUNTUTAN (claims) ---------- */
function viewTuntutan(){
  const list=S.claims.length?S.claims.map(claimCard).join(""):`<div class="empty"><b>Belum ada tuntutan</b></div>`;
  return `<div class="bar"><button class="add" id="addClaimBtn" style="flex:1">＋ Tuntutan baharu</button></div><div class="hint">Format ringkas ala BrioHR. Untuk Bajet Muayyasah, medan tambahan (agensi, akaun bank dll) akan muncul.</div><div class="rows">${list}</div>`;
}
function claimCard(c){const sb={"Draf":"b-n","Dihantar":"b-b","Lulus":"b-g","Tolak":"b-r"}[c.status]||"b-n";
  const money=c.jumlahDipohon;
  const muay=(true)?`
    <div class="grp"><h3>Butiran Bajet Muayyasah</h3>
     <div class="g2">${fld("Nama pemohon",CT(c.id,"namaPemohon",c.namaPemohon))}${fld("Nama agensi",CT(c.id,"namaAgensi",c.namaAgensi))}</div>
     ${fld("Tarikh aktiviti muayyasah",CT(c.id,"tarikhAktiviti",c.tarikhAktiviti,"date"))}
     ${fld("Perincian aktiviti",CTA(c.id,"perincianAktiviti",c.perincianAktiviti))}
     ${fld("Jumlah mad'u & mas'ul terlibat",CT(c.id,"jumlahMadu",c.jumlahMadu))}
     ${fld("Perincian perbelanjaan",CTA(c.id,"perincianBelanja",c.perincianBelanja))}
     ${fld("Pautan gambar bersama mad'u",CT(c.id,"gambarLink",c.gambarLink,"","https://…"))}
     ${fld("Jumlah bantuan kewangan dipohon (RM)",CT(c.id,"jumlahDipohon",c.jumlahDipohon))}
     <div class="g3">${fld("Penama akaun",CT(c.id,"penama",c.penama))}${fld("Nama bank",CT(c.id,"bank",c.bank))}${fld("No. akaun",CT(c.id,"akaun",c.akaun))}</div>
    </div>`:`
    <div class="grp"><h3>Butiran tuntutan</h3>
     <div class="g2">${fld("Jumlah (RM)",CT(c.id,"amount",c.amount))}${fld("Cukai",CT(c.id,"cukai",c.cukai))}</div>
     ${fld("No. resit",CT(c.id,"resit",c.resit))}${fld("Keterangan",CTA(c.id,"desc",c.desc))}</div>`;
  return `<div class="row${c._open?" open":""}"><div class="rhead" data-ctog="${c.id}"><div class="rav">${initials(c.reportName)||"T"}</div>
    <div class="rname">${esc((c.namaPemohon?c.namaPemohon+" - ":"")+(c.reportName||"(nama laporan)"))}</div>
    <div class="rtags"><span class="tag">${esc(c.jenis)}</span>${money?`<span class="tag ses">RM ${esc(money)}</span>`:``}<span class="badge ${sb}">${esc(c.status)}</span></div><span class="chev">▾</span></div>
    <div class="rbody">
      <div class="grp"><h3>Am</h3>
        ${fld("Nama laporan",CT(c.id,"reportName",c.reportName,"","Eg: Muayyasah Usrah A"))}
        ${fld("Tarikh transaksi",CT(c.id,"tarikh",c.tarikh,"date"))}
        ${fld("Pautan lampiran (resit/dokumen)",CT(c.id,"lampiran",c.lampiran,"","https://…"))}
        ${fld("Status",CS(c.id,"status",c.status,CLAIM_STATUS))}
      </div>
      ${muay}
      ${attList("claim",c.id,c.files)}<div class="actions"><button class="del" data-delclaim="${c.id}" style="flex:1">Buang</button></div>
    </div></div>`;
}
function CT(id,f,v,type,ph){return `<input data-ced="${id}" data-f="${f}" type="${type||"text"}" value="${esc(v)}" placeholder="${ph||""}">`;}
function CTA(id,f,v){return `<textarea data-ced="${id}" data-f="${f}">${esc(v)}</textarea>`;}
function CS(id,f,v,opts){return `<select data-ced="${id}" data-f="${f}">`+opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")+`</select>`;}

/* =============== EVENTS =============== */
document.addEventListener("click",e=>{
  const nav=e.target.closest(".navtab");if(nav){setView(nav.dataset.view);return;}
  const stg=e.target.closest("[data-stage]");if(stg){stage=stg.dataset.stage;render();return;}
  const tog=e.target.closest("[data-tog]");if(tog){const p=get(tog.dataset.tog);if(p){const was=p._open;S.people.forEach(x=>x._open=false);p._open=!was;render();}return;}
  const et=e.target.closest("[data-etab]");if(et){const[id,t]=et.dataset.etab.split("|");const p=get(id);if(p){p._etab=+t;render();}return;}
  const tgl=e.target.closest("[data-tgl]");if(tgl){const[id,f,v]=tgl.dataset.tgl.split("|");const p=get(id);if(p){p[f]=(v==="true"?true:(v==="false"?false:v));save();render();}return;}
  const sc=e.target.closest("[data-score]");if(sc){const[id,it,v]=sc.dataset.score.split("|");const p=get(id);if(p){p.bpmy=p.bpmy||{};p.bpmy[it]=+v;save();render();}return;}
  const as=e.target.closest("[data-addses]");if(as){const p=get(as.dataset.addses);if(p){p.sessions=p.sessions||[];p.sessions.push({id:uid("s_"),jenis:"Usrah",tarikh:today(),oleh:p.pd1||"",oleh2:p.pd2||"",nota:""});save();render();}return;}
  const ds=e.target.closest("[data-delses]");if(ds){const[pid,sid]=ds.dataset.delses.split("|");const p=get(pid);if(p){p.sessions=p.sessions.filter(x=>x.id!==sid);save();render();}return;}
  const pr=e.target.closest("[data-promote]");if(pr){promote(get(pr.dataset.promote));return;}
  const del=e.target.closest("[data-del]");if(del){const p=get(del.dataset.del);if(p&&confirm(`Buang "${p.nama||"rekod"}"?`)){S.people=S.people.filter(x=>x.id!==p.id);save();render();toast("Dibuang");}return;}
  const bx=e.target.closest("[data-bpmyxl]");if(bx){exportBPMy(get(bx.dataset.bpmyxl));return;}
  if($("#addBtn")&&e.target.closest("#addBtn")){const p=newPerson(stage==="all"?"mutabaah":stage);S.people.unshift(p);q="";save();render();window.scrollTo({top:0,behavior:"smooth"});return;}
  // minit
  const mtog=e.target.closest("[data-mtog]");if(mtog){const m=getM(mtog.dataset.mtog);if(m){m._open=!m._open;render();}return;}
  if($("#addMeetBtn")&&e.target.closest("#addMeetBtn")){S.meetings.unshift(newMeeting());save();render();return;}
  const ait=e.target.closest("[data-addit]");if(ait){const m=getM(ait.dataset.addit);if(m){m.items.push(newItem());save();render();}return;}
  const dit=e.target.closest("[data-delit]");if(dit){const[mid,iid]=dit.dataset.delit.split("|");const m=getM(mid);if(m){m.items=m.items.filter(x=>x.id!==iid);save();render();}return;}
  const dm=e.target.closest("[data-delmeet]");if(dm){const m=getM(dm.dataset.delmeet);if(m&&confirm("Buang mesyuarat?")){S.meetings=S.meetings.filter(x=>x.id!==m.id);save();render();}return;}
  const dn=e.target.closest("[data-done]");if(dn){const[mid,iid]=dn.dataset.done.split("|");const m=getM(mid);const it=m&&m.items.find(x=>x.id===iid);if(it){it.status="Selesai";save();render();toast("Selesai");}return;}
  const hd=e.target.closest("[data-hadir]");if(hd){const[mid,en]=hd.dataset.hadir.split("|");const nm=decodeURIComponent(en);const m=getM(mid);if(m){m.hadir=m.hadir||[];const i=m.hadir.indexOf(nm);if(i>=0)m.hadir.splice(i,1);else m.hadir.push(nm);save();render();}return;}
  const ah=e.target.closest("[data-addhadir]");if(ah){const m=getM(ah.dataset.addhadir);if(m){const nm=titleCase((prompt("Tambah nama kehadiran:")||"").trim());if(nm){S.roster=S.roster||[];if(!S.roster.includes(nm)&&!(S.pds||[]).includes(nm))S.roster.push(nm);m.hadir=m.hadir||[];if(!m.hadir.includes(nm))m.hadir.push(nm);save();render();}}return;}
  // wasilah
  const wm=e.target.closest("[data-wmode]");if(wm){wasMode=wm.dataset.wmode;render();return;}
  const wtog=e.target.closest("[data-wtog]");if(wtog){const w=getW(wtog.dataset.wtog);if(w){w._open=!w._open;if(wasMode==="cal")wasMode="list";render();}return;}
  if($("#addWasBtn")&&e.target.closest("#addWasBtn")){S.wasilah.unshift(newWasilah());wasMode="list";save();render();return;}
  const dw=e.target.closest("[data-delwas]");if(dw){const w=getW(dw.dataset.delwas);if(w&&confirm("Buang wasilah?")){S.wasilah=S.wasilah.filter(x=>x.id!==w.id);save();render();}return;}
  const cn=e.target.closest("[data-calnav]");if(cn){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+ (+cn.dataset.calnav),1);render();return;}
  const ht=e.target.closest("[data-htog]");if(ht){const x=getH(ht.dataset.htog);if(x){x._open=!x._open;render();}return;}
  if($("#addHolBtn")&&e.target.closest("#addHolBtn")){S.holidays.unshift(newHoliday());wasMode="list";save();render();return;}
  const dhl=e.target.closest("[data-delhol]");if(dhl){const x=getH(dhl.dataset.delhol);if(x&&confirm("Buang tarikh ini?")){S.holidays=S.holidays.filter(y=>y.id!==x.id);save();render();}return;}
  // claims
  const ctog=e.target.closest("[data-ctog]");if(ctog){const c=getC(ctog.dataset.ctog);if(c){c._open=!c._open;render();}return;}
  if($("#addClaimBtn")&&e.target.closest("#addClaimBtn")){S.claims.unshift(newClaim());save();render();return;}
  const dc=e.target.closest("[data-delclaim]");if(dc){const c=getC(dc.dataset.delclaim);if(c&&confirm("Buang tuntutan?")){S.claims=S.claims.filter(x=>x.id!==c.id);save();render();}return;}
  const ub=e.target.closest("[data-uplbtn]");if(ub){const [kind,id]=ub.dataset.uplbtn.split("|");pickAndUpload(kind,id);return;}
  const ra=e.target.closest("[data-rmatt]");if(ra){const [kind,id,idx]=ra.dataset.rmatt.split("|");if(kind==="person"){const p=get(id);if(p&&p.lampiran){p.lampiran.splice(+idx,1);save();render();}}else if(kind==="claim"){const c=getC(id);if(c&&c.files){c.files.splice(+idx,1);save();render();}}return;}
  if(!e.target.closest(".menu"))$("#menuPop").classList.remove("show");
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset||{};if(!(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  if(d.ed&&d.f){const p=get(d.ed);if(p){let v=t.value;if(d.f==="telefon"){v=fmtPhone(v);t.value=v;}else if(d.f==="poskod"){v=v.replace(/\D/g,"").slice(0,5);t.value=v;}if(d.f.indexOf("rmk_")===0){p.remarks=p.remarks||{};p.remarks[d.f.slice(4)]=v;}else p[d.f]=v;save();}return;}
  if(d.ses&&d.f){const[pid,sid]=d.ses.split("|");const p=get(pid);const s=p&&p.sessions.find(x=>x.id===sid);if(s){s[d.f]=t.value;save();}return;}
  if(d.med&&d.f){const m=getM(d.med);if(m){m[d.f]=t.value;save();}return;}
  if(d.mit&&d.f){const[mid,iid]=d.mit.split("|");const m=getM(mid);const it=m&&m.items.find(x=>x.id===iid);if(it){it[d.f]=t.value;save();}return;}
  if(d.wed&&d.f){const w=getW(d.wed);if(w){w[d.f]=t.value;save();}return;}
  if(d.hed&&d.f){const x=getH(d.hed);if(x){x[d.f]=t.value;save();}return;}
  if(d.ced&&d.f){const c=getC(d.ced);if(c){c[d.f]=t.value;save();}return;}
});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset||{};
  if(d.ed&&d.f&&t.tagName==="SELECT"){const p=get(d.ed);if(!p)return;
    if(t.value==="__add__"&&d.list){const lbl={universities:"IPT",pds:"PD",kolej:"kolej"}[d.list]||"item";const name=titleCase((prompt("Tambah "+lbl+" baharu:")||"").trim());if(name){if(!S[d.list].includes(name))S[d.list].push(name);S[d.list].sort();p[d.f]=name;}save();render();return;}
    p[d.f]=t.value;save();render();return;}
  if(d.ed&&d.f&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")){const p=get(d.ed);if(p){let v=normVal(d.f,t.value);t.value=v;if(d.f.indexOf("rmk_")===0){p.remarks=p.remarks||{};p.remarks[d.f.slice(4)]=v;}else p[d.f]=v;save();
    if(d.f==="nama"){const row=t.closest(".row");if(row){const rn=row.querySelector(".rname");if(rn){rn.textContent=v||"(nama baharu)";rn.classList.toggle("empty",!v);}const av=row.querySelector(".rav");if(av)av.textContent=initials(v);}}}return;}
  if(d.ses&&d.f&&t.tagName==="SELECT"){const[pid,sid]=d.ses.split("|");const p=get(pid);const s=p&&p.sessions.find(x=>x.id===sid);if(s){s[d.f]=t.value;save();render();}return;}
  if(d.med&&d.f&&(t.tagName==="SELECT"||t.type==="date")){const m=getM(d.med);if(m){m[d.f]=t.value;save();render();}return;}
  if(d.mit&&d.f&&t.tagName==="SELECT"){const[mid,iid]=d.mit.split("|");const m=getM(mid);const it=m&&m.items.find(x=>x.id===iid);if(it){it[d.f]=t.value;save();render();}return;}
  if(d.wed&&d.f&&(t.tagName==="SELECT"||t.type==="date")){const w=getW(d.wed);if(w){w[d.f]=t.value;save();render();}return;}
  if(d.hed&&d.f){const x=getH(d.hed);if(x){x[d.f]=(d.f==="nama"?titleCase(t.value):t.value);t.value=x[d.f];save();render();}return;}
  if(d.ced&&d.f&&(t.tagName==="SELECT"||t.type==="date")){const c=getC(d.ced);if(c){c[d.f]=t.value;save();render();}return;}
  const flt=t.closest?t.closest("[data-flt]"):null;if(flt){F[flt.dataset.flt]=t.value;render();return;}
});
document.addEventListener("input",e=>{if(e.target.id==="search"){q=e.target.value.trim().toLowerCase();const list=$(".rows");if(list)renderListOnly();}});
function renderListOnly(){const l=document.querySelector(".rows");if(!l)return;const arr=filteredPeople();l.innerHTML=arr.length?arr.map(rowKeahlian).join(""):`<div class="empty"><b>Tiada rekod</b></div>`;}

$("#menuBtn").addEventListener("click",e=>{e.stopPropagation();$("#menuPop").classList.toggle("show");});
$("#menuPop").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;$("#menuPop").classList.remove("show");
  if(a==="json")exportJSON();if(a==="csv")exportCSV();if(a==="import")$("#fileImport").click();if(a==="importxl")$("#fileXl").click();
  if(a==="login")gateShow();
  if(a==="pull")pullNow();
  if(a==="reset"){if(confirm("Set semula SEMUA data? Simpan JSON dahulu jika perlu.")){S={people:[],meetings:[],wasilah:[],claims:[],universities:[],pds:[],holidays:[],_holSeeded:false};normalizeS();save();render();toast("Diset semula");}}});
$("#fileImport").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S=Object.assign({people:[],meetings:[],wasilah:[],claims:[]},d);normalizeS();save();render();toast("Data dimuat");}catch(err){toast("Fail tidak sah");}};r.readAsText(f);e.target.value="";});
$("#fileXl").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;importNames(f);e.target.value="";});

function promote(p){if(!p)return;if(!eligible(p)){if(!confirm("Belum layak. Teruskan?"))return;}
  if(p.stage==="baru")p.stage="mutabaah";else if(p.stage==="mutabaah"){p.stage="muhib";if(!p.tarikhMuhib)p.tarikhMuhib=today();}
  else if(p.stage==="muhib"){p.stage="muayyid";if(!p.tarikhMuayyid)p.tarikhMuayyid=today();}
  save();stage=p.stage;render();toast("Naik ke "+stageLabel(p.stage));}

/* ---- import names ---- */
function importNames(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const addRows=rows=>{ // rows: array of objects keyed by header (lowercased)
    let added=0;
    rows.forEach(o=>{const nama=o.nama||o.name||o["nama penuh"]||"";if(!String(nama).trim())return;
      const p=newPerson((String(o["status tarbiyyah"]||o.peringkat||o.stage||"mutabaah")).trim().toLowerCase());p._open=false;
      p.nama=titleCase(String(nama).trim());
      p.universiti=o.universiti||o["institut pengajian tinggi (ipt)"]||o.ipt||"";
      p.bidang=titleCase(o.bidang||o.kursus||o["bidang pengajian"]||"");
      p.tahap=titleCase(o["tahap pengajian"]||o.tahap||"");
      p.tahunMasuk=String(o["tahun kemasukan ke ipt"]||o["tahun kemasukan"]||o.tahunmasuk||"");
      p.ic=String(o.ic||o["no kad pengenalan"]||o.kp||"");
      p.noKeahlian=String(o.keahlian||o["no keahlian"]||o.nokeahlian||"");
      p.statusAhli=(o["status ahli"]?(/^ya/i.test(o["status ahli"])?"Ya":"Belum"):(p.noKeahlian?"Ya":"Belum"));
      p.email=String(o.email||o.emel||"").trim().toLowerCase();
      p.negeri=o.negeri||"";
      p.pd1=o.pd||o.pd1||o["nama murobbi"]||o.murobbi||"";p.pd2=o.pd2||"";
      p.telefon=fmtPhone(o.telefon||o["no. telefon"]||o["no telefon"]||o.phone||"");
      p.tahunPSPB=String(o.tahun||o["tahun pspb"]||o.tahunpspb||"2026");
      p.minatAJK=/^ya/i.test(String(o["berminat untuk menjadi ajk pembina?"]||o["minat ajk"]||o.minatajk||""))?"Ya":"Tidak";
      p.minatUsrah=/^ya/i.test(String(o["berminat untuk menyertai usrah?"]||o["minat usrah"]||o.minatusrah||""))?"Ya":"Belum";
      if(!STAGES.find(s=>s.id===p.stage))p.stage="mutabaah";
      if(p.pd1&&!S.pds.includes(p.pd1))S.pds.push(p.pd1);
      if(p.pd2&&!S.pds.includes(p.pd2))S.pds.push(p.pd2);
      if(p.universiti&&!S.universities.includes(p.universiti))S.universities.push(p.universiti);
      S.people.push(p);added++;});
    S.pds.sort();S.universities.sort();save();render();toast(added+" nama ditambah");
  };
  const r=new FileReader();
  if(ext==="csv"){r.onload=()=>{addRows(parseCSV(r.result));};r.readAsText(file);}
  else{ if(typeof XLSX==="undefined"){toast("Pustaka Excel tidak dimuat — guna CSV atau sambung internet");return;}
    r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const arr=XLSX.utils.sheet_to_json(ws,{defval:""});
      const norm=arr.map(o=>{const n={};Object.keys(o).forEach(k=>n[String(k).trim().toLowerCase()]=o[k]);return n;});addRows(norm);}catch(err){toast("Gagal baca Excel");}};r.readAsArrayBuffer(file);}
}
function parseCSV(txt){txt=txt.replace(/^\ufeff/,"");const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const split=l=>{const out=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===","&&!q){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out;};
  const head=split(lines[0]).map(h=>h.trim().toLowerCase());
  return lines.slice(1).map(l=>{const c=split(l);const o={};head.forEach((h,i)=>o[h]=(c[i]||"").trim());return o;});}

/* ---- export ---- */
function dl(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function cc(v){v=(v==null?"":String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportJSON(){dl(`KitPD-${today()}.json`,JSON.stringify(S,null,2),"application/json");toast("JSON dimuat turun");}
function exportCSV(){const head=["Nama","Peringkat","Tahun PSPB","Aktif","Status ahli","IC","No Keahlian","Email","Status","IPT","Kolej","Bidang","Tahap","Tahun masuk IPT","Telefon","PD1","PD2","Poskod","Negeri","Tajmik","Sesi","Minat usrah","Minat AJK","BPMy %","Keadaan"];
  const rows=S.people.map(p=>[p.nama,stageLabel(p.stage),p.tahunPSPB,p.active===false?"Tidak":"Ya",p.statusAhli,p.ic,p.noKeahlian,p.email,p.kerja,p.universiti,p.kolej,p.bidang,p.tahap,p.tahunMasuk,p.telefon,p.pd1,p.pd2,p.poskod,p.negeri,p.tajmik,sesCount(p),p.minatUsrah,p.minatAJK,p.stage==="muhib"?Math.round(bpmy(p).pct*100):"",statusOf(p).t].map(cc).join(","));
  dl(`KitPD-Keahlian-${today()}.csv`,"\ufeff"+[head.join(","),...rows].join("\n"),"text/csv");toast("CSV dimuat turun");}

function exportBPMy(p){if(!p)return;const b=bpmy(p);
  const aoa=[["BORANG PENCALONAN MUAYYID"],["Nama :",p.nama||""],["Tarikh akhir kemaskini :",today()],[],
    ["GAMBARAN FOKUS TARBIAH MHB","% CAPAI","% PENUH"]];
  SUMMARY_ORDER.forEach(cid=>{const c=b.cats.find(x=>x.id===cid);aoa.push([c.name,(c.score/BPMY_MAX),(c.max/BPMY_MAX)]);});
  aoa.push(["TOTAL",b.pct,1]);aoa.push(["LULUS (≥50%)?",b.pass?"YA":"BELUM"]);aoa.push([]);
  aoa.push(["NO","PERKARA","PENCAPAIAN (0-5)","PEMBERAT","SKOR"]);
  BPMY.forEach(c=>{aoa.push([c.id.toUpperCase(),c.name.toUpperCase(),"","",""]);
    c.items.forEach(it=>{const pen=(p.bpmy&&p.bpmy[it.id])||0;aoa.push([it.id,it.t+(it.wajib?" (WAJIB)":""),pen,it.w,pen*it.w]);});});
  aoa.push([]);aoa.push(["","JUM SKOR","","",b.total+" / "+BPMY_MAX]);
  if(typeof XLSX==="undefined"){dl(`BPMy-${(p.nama||"Nama")}-${today()}.csv`,"\ufeff"+aoa.map(r=>r.map(cc).join(",")).join("\n"),"text/csv");toast("BPMy CSV dimuat turun");return;}
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=[{wch:8},{wch:48},{wch:16},{wch:10},{wch:12}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"BPMy-"+((p.nama||"Nama").slice(0,20)));
  XLSX.writeFile(wb,`BPMy-${(p.nama||"Nama").replace(/\s+/g,"_")}-${today()}.xlsx`);toast("BPMy Excel dimuat turun");}

/* ---- normalize + holidays ---- */
function normalizeS(){S.people=S.people||[];S.meetings=S.meetings||[];S.wasilah=S.wasilah||[];S.claims=S.claims||[];S.universities=(S.universities&&S.universities.length)?S.universities:["UiTM Shah Alam","UiTM Puncak Perdana","MSU"];S.pds=S.pds||[];S.kolej=S.kolej||[];S.roster=S.roster||[];S.holidays=S.holidays||[];seedHolidays();}
function seedHolidays(){if(S._holSeeded)return;const seed=[["Tahun Baharu","2026-01-01"],["Hari Pekerja","2026-05-01"],["Hari Kebangsaan","2026-08-31"],["Hari Malaysia","2026-09-16"],["Keputeraan Sultan Selangor","2026-12-11"],["Krismas","2026-12-25"],["Tahun Baharu","2027-01-01"],["Hari Pekerja","2027-05-01"],["Hari Kebangsaan","2027-08-31"],["Hari Malaysia","2027-09-16"],["Keputeraan Sultan Selangor","2027-12-11"],["Krismas","2027-12-25"]];seed.forEach(([n,dd])=>S.holidays.push({id:uid("h_"),nama:n,jenis:"Cuti Umum",start:dd,end:"",_open:false}));S._holSeeded=true;}
function newHoliday(){return{id:uid("h_"),nama:"",jenis:"Cuti Semester",start:today(),end:"",_open:true};}
function getH(id){return(S.holidays||[]).find(x=>x.id===id);}

/* ---- sync + login ---- */
let cfg={url:"",name:""};const CFGKEY="kitpd_cfg";
function loadCfg(){try{const v=localStorage.getItem(CFGKEY);if(v)cfg=Object.assign(cfg,JSON.parse(v));}catch(e){}}
function saveCfg(){try{localStorage.setItem(CFGKEY,JSON.stringify({url:cfg.url,name:cfg.name}));}catch(e){}}
let SYNC={ok:false,code:"",busy:false};
async function apiGet(code){const u=cfg.url+(cfg.url.indexOf("?")>-1?"&":"?")+"action=get&code="+encodeURIComponent(code);const r=await fetch(u);return await r.json();}
async function apiSave(){const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",code:SYNC.code,by:cfg.name,data:JSON.stringify(S)})});return await r.json();}
async function pushSync(){if(SYNC.busy||!SYNC.ok)return;SYNC.busy=true;try{await apiSave();}catch(e){}SYNC.busy=false;}
async function pullNow(){if(!SYNC.ok){toast("Log masuk dahulu");return;}if(!confirm("Tarik data terkini dari Google Sheet? Data pada peranti ini akan diganti."))return;try{const res=await apiGet(SYNC.code);if(res&&res.ok){if(res.data){S=JSON.parse(res.data);normalizeS();}save();render();toast("Data terkini ditarik");}else toast("Gagal menarik data");}catch(e){toast("Tidak dapat menyambung");}}
function gateShow(){const g=$("#gate");g.style.display="flex";$("#gUrl").value=cfg.url||"";$("#gName").value=cfg.name||"";$("#gErr").textContent="";}
function gateHide(){$("#gate").style.display="none";}
function bindGate(){$("#gSave").addEventListener("click",()=>{cfg.url=$("#gUrl").value.trim();saveCfg();toast("URL disimpan");});$("#gOffline").addEventListener("click",()=>{gateHide();toast("Mod luar talian");});$("#gLogin").addEventListener("click",doLogin);}
async function doLogin(){const name=$("#gName").value.trim(),code=$("#gCode").value.trim();cfg.url=$("#gUrl").value.trim()||cfg.url;cfg.name=name;saveCfg();$("#gErr").textContent="";
  if(!cfg.url){$("#gErr").textContent="Tetapkan URL Apps Script dahulu (Tetapan).";return;}
  if(!code){$("#gErr").textContent="Masukkan kod akses.";return;}
  const btn=$("#gLogin");btn.textContent="Menyambung…";
  try{const res=await apiGet(code);if(res&&res.ok){SYNC.ok=true;SYNC.code=code;if(res.data){try{S=JSON.parse(res.data);normalizeS();save();}catch(e){}}gateHide();render();toast("Log masuk berjaya");}
    else{$("#gErr").textContent=(res&&res.error)?("Gagal: "+res.error):"Kod salah atau URL tidak sah.";}}
  catch(e){$("#gErr").textContent="Tidak dapat menyambung. Semak URL / internet.";}
  btn.textContent="Log masuk";}

/* ---- upload lampiran ke Drive (via Apps Script) ---- */
async function uploadFile(file,cb){
  if(!SYNC.ok||!cfg.url||!SYNC.code){toast("Log masuk & sync dahulu untuk muat naik");return;}
  if(file.size>5*1024*1024){toast("Fail terlalu besar (maks 5MB)");return;}
  let b64;try{b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}catch(e){toast("Gagal baca fail");return;}
  toast("Memuat naik…");
  try{const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"upload",code:SYNC.code,filename:file.name,mime:file.type||"application/octet-stream",data:b64})});
    const res=await r.json();
    if(res&&res.ok&&res.url){cb({name:res.name||file.name,url:res.url});toast("Berjaya dimuat naik");}
    else toast((res&&res.error)?("Gagal: "+res.error):"Muat naik gagal");
  }catch(e){toast("Tidak dapat menyambung");}
}
function pickAndUpload(kind,id){const inp=document.createElement("input");inp.type="file";inp.accept="image/*,.pdf";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)uploadFile(f,att=>addAttachment(kind,id,att));};inp.click();}
function addAttachment(kind,id,att){if(kind==="person"){const p=get(id);if(p){p.lampiran=p.lampiran||[];p.lampiran.push(att);save();render();}}else if(kind==="claim"){const c=getC(id);if(c){c.files=c.files||[];c.files.push(att);save();render();}}}

(async function(){await load();render();loadCfg();bindGate();if(cfg.url)gateShow();})();
</script>
